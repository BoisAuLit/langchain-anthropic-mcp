<svg width="900" height="1872" viewBox="0 0 900 1872" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 16px; fill: #666; }
    .sec { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
    .small { font-size: 14px; fill: #444; }
    .tiny { font-size: 13px; fill: #555; }
    .mono { font-family: "SF Mono","Menlo","Consolas",monospace; font-size: 13px; fill: #37474F; }
    .en { font-style: italic; }
    /* color classes LAST */
    .w { fill: #fff; } .wg { fill: #CFD8DC; }
    .cV { fill: #1565C0; } .cT { fill: #00897B; } .cO { fill: #EF6C00; } .cP { fill: #8E24AA; }
    .cR { fill: #C62828; } .cG { fill: #2E7D32; } .cm { fill: #7B1FA2; } .cGray { fill: #888; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#546E7A" stroke-width="1.6" stroke-linecap="round"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="1872" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" class="title">LLM 质量评估与基准测试 📏 <tspan font-size="16" fill="#666" class="en">Quality Metrics &amp; Benchmarks</tspan></text>
  <text x="40" y="78" class="subtitle">一句话本质：选 LLM = 先看<tspan class="cV" font-weight="700">可量化特征</tspan>缩小范围，再用<tspan class="cP" font-weight="700">质量基准</tspan>挑最合适的；</text>
  <text x="40" y="102" class="subtitle">但基准会<tspan class="cR" font-weight="700">饱和</tspan>、会被<tspan class="cR" font-weight="700">污染</tspan> —— 选型是一个"重要但临时"的决定，迟早要换新模型。</text>
  <line x1="40" y1="120" x2="860" y2="120" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ① quantifiable characteristics -->
  <text x="40" y="156" class="sec">① 📐 可量化特征 <tspan class="en">Important LLM Characteristics</tspan>（先用它缩小候选）</text>
  <!-- table -->
  <rect x="40" y="176" width="820" height="36" fill="#37474F"/>
  <text x="60" y="200" class="small w" font-weight="700">特征 Characteristic</text>
  <text x="300" y="200" class="small w" font-weight="700">含义与要点</text>
  <rect x="40" y="212" width="820" height="34" fill="#F5F5F5"/>
  <text x="60" y="234" class="small cV" font-weight="700">模型大小 Size</text>
  <text x="300" y="234" class="small">参数量（小 1~10B / 大 100~500B+）。越大常越强，但<tspan class="cR" font-weight="700">一定更贵</tspan>。</text>
  <rect x="40" y="246" width="820" height="34" fill="#FFFFFF"/>
  <text x="60" y="268" class="small cV" font-weight="700">成本 Cost</text>
  <text x="300" y="268" class="small">按"每百万 token"计费，输入/输出常不同价。新、大模型通常更贵。</text>
  <rect x="40" y="280" width="820" height="34" fill="#F5F5F5"/>
  <text x="60" y="302" class="small cV" font-weight="700">上下文窗口 Context</text>
  <text x="300" y="302" class="small">能一次处理的最大 token 数（prompt＋completion 共用）。但仍按 token 付费。</text>
  <rect x="40" y="314" width="820" height="34" fill="#FFFFFF"/>
  <text x="60" y="336" class="small cV" font-weight="700">延迟与速度 Latency</text>
  <text x="300" y="336" class="small">首 token 时间、每秒 token 数。实时交互场景常愿牺牲其他换低延迟。</text>
  <rect x="40" y="348" width="820" height="34" fill="#F5F5F5"/>
  <text x="60" y="370" class="small cV" font-weight="700">训练截止日期 Cutoff</text>
  <text x="300" y="370" class="small">训练数据的最后时间点。<tspan class="cG" font-weight="700">越新越好</tspan>（尤其要答近期事件时）。</text>

  <!-- ② three benchmark types -->
  <text x="40" y="426" class="sec">② 🏅 质量难量化 → 用基准 <tspan class="en">benchmarks</tspan> 来比，分三大类</text>
  <text x="40" y="454" class="small">质量 = 从"推理复杂数学"到"文字读起来舒服"的一切。<tspan class="cR" font-weight="700">没有唯一权威榜单</tspan>，理解三类即可选对：</text>
  <rect x="40" y="470" width="260" height="48" rx="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="170" y="490" class="small cV" text-anchor="middle" font-weight="700">🤖 自动化 Automated</text>
  <text x="170" y="510" class="tiny" text-anchor="middle">用代码自动评分</text>
  <rect x="320" y="470" width="260" height="48" rx="8" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1.2"/>
  <text x="450" y="490" class="small cO" text-anchor="middle" font-weight="700">🧑‍⚖️ 人类评分 Human</text>
  <text x="450" y="510" class="tiny" text-anchor="middle">人来选更喜欢哪个回答</text>
  <rect x="600" y="470" width="260" height="48" rx="8" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="730" y="490" class="small cP" text-anchor="middle" font-weight="700">⚖️ LLM 当裁判 Judge</text>
  <text x="730" y="510" class="tiny" text-anchor="middle">一个 LLM 给另一个打分</text>

  <!-- ③ automated -->
  <text x="40" y="558" class="sec">③ 🤖 自动化基准 <tspan class="en">Automated Benchmarks</tspan></text>
  <text x="40" y="586" class="small">用代码可验证的任务打分，常见形式 = 各学科<tspan font-weight="700">选择题</tspan>、数学/编程挑战。</text>
  <text x="40" y="612" class="small">经典例子 <tspan class="cO" font-weight="700">MMLU</tspan>（Massive Multitask Language Understanding）：覆盖 <tspan font-weight="700">57 个学科</tspan>，STEM 到人文到法律。</text>
  <!-- mini bar chart MMLU vs MMLU-Pro -->
  <text x="560" y="586" class="tiny cGray">MMLU（橙）vs 更难的 MMLU-Pro（蓝）：</text>
  <g>
  <rect x="560" y="612" width="22" height="62" fill="#F5A623"/><rect x="584" y="624" width="22" height="50" fill="#3B7DD8"/>
  <text x="583" y="690" class="tiny" text-anchor="middle">GPT-4o</text>
  <rect x="640" y="618" width="22" height="56" fill="#F5A623"/><rect x="664" y="635" width="22" height="39" fill="#3B7DD8"/>
  <text x="663" y="690" class="tiny" text-anchor="middle">Llama-3</text>
  <rect x="720" y="628" width="22" height="46" fill="#F5A623"/><rect x="744" y="650" width="22" height="24" fill="#3B7DD8"/>
  <text x="743" y="690" class="tiny" text-anchor="middle">Gemma-7B</text>
  </g>
  <text x="40" y="644" class="small cGray">各家厂商常拿这些分数做营销 —— 找一个和你项目相关的即可。</text>

  <!-- ④ human evaluated -->
  <text x="40" y="730" class="sec">④ 🧑‍⚖️ 人类评分基准 <tspan class="en">Human-Evaluated</tspan></text>
  <text x="40" y="758" class="small">两个<tspan font-weight="700">匿名</tspan> LLM 回答同一 prompt → 人选更喜欢的 → 喂给<tspan class="cV" font-weight="700">ELO 算法</tspan>（国际象棋排名同款）→ 排行榜。</text>
  <text x="40" y="784" class="small">代表：<tspan class="cO" font-weight="700">LLM Arena</tspan>，被引用最广。能捕捉自动化基准抓不到的"细腻品质"。</text>
  <!-- mini leaderboard -->
  <rect x="40" y="800" width="500" height="30" fill="#37474F"/>
  <text x="56" y="820" class="small w" font-weight="700">Rank　Model　　　　　　　Score(ELO)　Org</text>
  <rect x="40" y="830" width="500" height="26" fill="#F5F5F5"/><text x="56" y="848" class="mono">1　 gemini-2.5-pro　　　 1463　 Google</text>
  <rect x="40" y="856" width="500" height="26" fill="#fff"/><text x="56" y="874" class="mono">2　 o3-2025-04-16　　　　1449　 OpenAI</text>
  <rect x="40" y="882" width="500" height="26" fill="#F5F5F5"/><text x="56" y="900" class="mono">5　 claude-opus-4　　　　1417　 Anthropic</text>
  <text x="560" y="848" class="small cGray">分数越高越强；</text>
  <text x="560" y="872" class="small cGray">ELO 是相对排名，</text>
  <text x="560" y="896" class="small cGray">靠海量人类投票累积。</text>

  <!-- ⑤ LLM as judge -->
  <text x="40" y="952" class="sec">⑤ ⚖️ LLM 当裁判 <tspan class="en">LLM-as-a-Judge</tspan></text>
  <text x="40" y="980" class="small">一个 LLM 拿着<tspan font-weight="700">参考答案</tspan>，给另一个 LLM 的回答打分 → 算出"<tspan class="cV" font-weight="700">胜率 win rate</tspan>"来对比。</text>
  <text x="60" y="1006" class="small"><tspan class="cG" font-weight="700">优点：</tspan>便宜、灵活。</text>
  <text x="60" y="1032" class="small"><tspan class="cR" font-weight="700">缺点：自我偏好偏差</tspan> —— 裁判倾向偏袒"自家模型"（GPT 偏爱 GPT、Gemini 偏爱 Gemini）。</text>
  <text x="40" y="1058" class="small cGray">解法：对现成裁判模型重新校准 recalibrate，可削弱这种偏差。</text>

  <!-- ⑥ good benchmark qualities -->
  <text x="40" y="1114" class="sec">⑥ ✅ 好基准的五个特质 <tspan class="en">Good Benchmark Qualities</tspan></text>
  <text x="40" y="1142" class="small"><tspan class="cG" font-weight="700">1. 相关 Relevant：</tspan>和你的项目对得上（不写代码就别看代码基准）。</text>
  <text x="40" y="1168" class="small"><tspan class="cG" font-weight="700">2. 够难 Difficult：</tspan>能区分强弱模型（人人满分的基准没用）。</text>
  <text x="40" y="1194" class="small"><tspan class="cG" font-weight="700">3. 可复现 Reproducible：</tspan>多次跑分稳定、厂商分数可被独立验证。</text>
  <text x="40" y="1220" class="small"><tspan class="cG" font-weight="700">4. 对齐现实 Align：</tspan>基准高分要真能转化为实际表现（多逛开发者论坛印证）。</text>
  <text x="40" y="1246" class="small cR" font-weight="700">5. ⚠️ 警惕数据污染 Data Contamination：</text>
  <text x="40" y="1272" class="small">　 基准题目可能早被模型在训练数据里"见过"→ 虚高分数。这是高分却名不副实的常见原因。</text>

  <!-- ⑦ benchmarks over time -->
  <text x="40" y="1328" class="sec">⑦ 📈 基准随时间饱和 <tspan class="en">Benchmarks Over Time</tspan></text>
  <text x="40" y="1356" class="small">规律：① 初期分数低 → ② 几年内追平人类专家 → ③ <tspan class="cR" font-weight="700">饱和 saturated</tspan>（都接近满分，无法区分）→</text>
  <text x="40" y="1382" class="small">④ 必须不断推出更难的新基准 → ⑤ 新基准很快又饱和 …… 循环往复。</text>
  <!-- schematic chart -->
  <line x1="560" y1="1500" x2="850" y2="1500" stroke="#90CAF9" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="570" y1="1400" x2="570" y2="1510" stroke="#90CAF9" stroke-width="1.5"/>
  <line x1="570" y1="1418" x2="850" y2="1418" stroke="#8E24AA" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="576" y="1412" class="tiny cP">人类水平 Human Level</text>
  <path d="M580 1495 Q610 1490 630 1450 T700 1420" fill="none" stroke="#EF6C00" stroke-width="2"/>
  <path d="M640 1495 Q680 1488 705 1448 T775 1418" fill="none" stroke="#1565C0" stroke-width="2"/>
  <path d="M715 1495 Q755 1486 785 1446 T845 1420" fill="none" stroke="#C62828" stroke-width="2"/>
  <text x="705" y="1518" class="tiny cGray" text-anchor="middle">每条曲线 = 一个基准，先后冲到人类线后"封顶"</text>
  <text x="40" y="1424" class="small cV" font-weight="700">主结论：今天的新模型通常远胜两年前的；你现在选的模型，迟早会被更强的替换。</text>
  <text x="40" y="1452" class="small">所以"选哪个 LLM"是个<tspan class="cR" font-weight="700">重要但临时</tspan>的决定 —— 设计 RAG 时就该预留"将来换模型"的余地。</text>

  <!-- ⑧ latest intel -->
  <text x="40" y="1540" class="sec">📡 2026 最新情报（你额外要求，已联网核实 · 截至 2026-06）</text>
  <text x="40" y="1568" class="small">这节课的"饱和"预言已成现实 —— 课件举的 <tspan class="cO" font-weight="700">MMLU 如今已饱和</tspan>（前沿模型 88~94%，难分高下）。</text>
  <text x="40" y="1594" class="small">2026 真正"有头部空间"的硬核新基准（直接呼应⑦的"不断引入更难基准"）：</text>
  <text x="40" y="1620" class="small">· <tspan class="cV" font-weight="700">Humanity's Last Exam (HLE)：</tspan>号称史上最难推理题，<tspan class="cR" font-weight="700">顶尖模型仍&lt;20%</tspan>，人类专家约 90% —— 50+ 分的鸿沟。</text>
  <text x="40" y="1646" class="small">· <tspan class="cV" font-weight="700">GPQA-Diamond：</tspan>博士出的"防搜索"科学题，198 道最难子集；2026 年 4 月前沿模型聚在 70 多分。</text>
  <text x="40" y="1672" class="small">· <tspan class="cV" font-weight="700">ARC-AGI-2：</tspan>更难的视觉抽象推理，当前 SOTA 仅 60 多分（抵抗了破解初代的技巧）。</text>
  <text x="40" y="1698" class="small">· <tspan class="cV" font-weight="700">FrontierMath：</tspan>研究级数学家出的未公开难题，最强模型也&lt;20%。</text>
  <text x="40" y="1724" class="small">· <tspan class="cV" font-weight="700">编程评测：</tspan>用 <tspan class="cO" font-weight="700">SWE-bench Verified / Pro</tspan>（真实 GitHub issue 修复）替代已饱和的 HumanEval。</text>
  <text x="40" y="1752" class="small cV" font-weight="700">一句话：本课的 MMLU 已"过气"成饱和基准；2026 选型要看 HLE / GPQA-Diamond / ARC-AGI-2 这类未污染的硬榜。</text>

  <text x="40" y="1808" class="small cGray">🧪 个人补充（非课件）：选型时优先看"未饱和 + 与你任务相关"的基准；榜单分数 ≠ 你的场景表现，</text>
  <text x="40" y="1834" class="small cGray">　 最终仍要用自己的数据小规模实测（这正是上节课 Lab 教你跑参数的意义）。</text>
</svg>
