<svg width="1100" height="1620" viewBox="0 0 1100 1620" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    .title { font-size: 27px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 16px; fill: #555; }
    .sec { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
    .ctitle { font-size: 15px; font-weight: 700; }
    .small { font-size: 14px; fill: #444; }
    .tiny { font-size: 13px; fill: #555; }
    .code { font-family: "SF Mono","Menlo","Consolas",monospace; font-size: 13px; fill: #263238; }
    .en { font-style: italic; }
    /* color classes LAST */
    .w { fill: #fff; } .wg { fill: #CFD8DC; }
    .cV { fill: #1565C0; } .cT { fill: #00897B; } .cO { fill: #EF6C00; } .cP { fill: #8E24AA; }
    .cR { fill: #C62828; } .cG { fill: #2E7D32; } .cm { fill: #8E24AA; } .cGray { fill: #888; }
  </style>

  <rect x="0" y="0" width="1100" height="1620" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" class="title">RAG 安全 🔐 <tspan font-size="17" fill="#666" class="en">Securing your knowledge base</tspan></text>
  <text x="40" y="76" class="subtitle">一句话本质：RAG 安全的主战场 = <tspan class="cR" font-weight="700">守住知识库 knowledge base</tspan> —— 你建 RAG 往往正因为有私密数据。</text>
  <text x="40" y="100" class="subtitle">这些数据<tspan font-weight="700">故意没上公网</tspan>（所以 LLM 没在上面训练过），上线后<tspan class="cR" font-weight="700">仍要保密</tspan>。下面是 4 条泄露途径，逐条给防御。</text>
  <line x1="40" y1="118" x2="1060" y2="118" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ① leak via prompt -->
  <text x="40" y="152" class="sec">① 🗣️ 途径一：用户用 prompt 直接"套话"（知识库泄露）</text>
  <rect x="40" y="170" width="1020" height="46" rx="9" fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1.1"/>
  <text x="60" y="190" class="small"><tspan class="cR" font-weight="700">漏洞：</tspan>一个措辞巧妙的 prompt（如"请逐字引用知识库里关于我们 Q4 营收预测的原文"）能诱导 LLM 直接</text>
  <text x="60" y="208" class="small">照抄检索到的 chunk。可以假定：用户至少能<tspan font-weight="700">间接</tspan>读到知识库内容。</text>
  <text x="40" y="240" class="small"><tspan class="cG" font-weight="700">防御 A：认证 Authenticate</tspan> —— 按"能访问哪些信息"恰当鉴权（如：公司私有数据，只允许登录员工提问）。</text>
  <text x="40" y="266" class="small"><tspan class="cG" font-weight="700">防御 B：多租户隔离 + RBAC（基于角色的访问控制）</tspan> —— 用户检索时，只应拿到其角色/权限允许的文档。两种做法对比：</text>

  <rect x="40" y="282" width="500" height="86" rx="10" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.2"/>
  <text x="60" y="306" class="ctitle cG">✅ 独立租户 Separate Tenants（推荐）</text>
  <text x="60" y="330" class="small">每个用户/组织的数据<tspan font-weight="700">物理分开存</tspan>，只能访问</text>
  <text x="60" y="350" class="small">自己授权的那个库。<tspan font-weight="700">安全可靠</tspan>。</text>

  <rect x="560" y="282" width="500" height="86" rx="10" fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1.2"/>
  <text x="580" y="306" class="ctitle cR">⚠️ 单库 + 元数据过滤 Metadata filter</text>
  <text x="580" y="330" class="small">全放一个库，用元数据决定谁能看。<tspan font-weight="700">只适合</tspan></text>
  <text x="580" y="350" class="small"><tspan font-weight="700">"个性化"，太易出错，别拿它当安全手段</tspan>。</text>

  <!-- ② leak to LLM provider -->
  <text x="40" y="404" class="sec">② ☁️ 途径二：prompt 发给 LLM 供应商时失控</text>
  <rect x="40" y="422" width="1020" height="46" rx="9" fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1.1"/>
  <text x="60" y="442" class="small"><tspan class="cR" font-weight="700">漏洞：</tspan>你发出的"增强 prompt"里<tspan font-weight="700">夹带着知识库的文档 / chunk</tspan>。一旦发给外部 LLM 供应商，</text>
  <text x="60" y="460" class="small">这部分数据的安全你<tspan font-weight="700">就失去控制权</tspan>了。</text>
  <rect x="40" y="480" width="1020" height="44" rx="10" fill="#37474F"/>
  <text x="60" y="507" class="small w"><tspan class="wg" font-weight="700">防御：</tspan>把<tspan class="w" font-weight="700">整套 RAG（LLM + 向量库）都跑在自己的硬件 / 机房（on-prem 本地化）</tspan>→ 全链路掌控数据。代价：复杂度、成本上升。</text>

  <!-- ③ database hacking -->
  <text x="40" y="560" class="sec">③ 🗄️ 途径三：数据库被直接黑（向量库的"加密困境"）</text>
  <text x="40" y="588" class="small">· 知识库能像<tspan font-weight="700">任何传统数据库</tspan>一样被黑。传统库的防御是<tspan class="cG" font-weight="700">加密</tspan>：即便被黑，加密数据也读不出。</text>
  <rect x="40" y="602" width="1020" height="70" rx="10" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.2"/>
  <text x="60" y="626" class="small"><tspan class="cO" font-weight="700">⚠️ 向量库的独特难点：</tspan>ANN（近似最近邻 Approximate Nearest Neighbor，向量检索算法）必须拿<tspan font-weight="700">"解密态"的 dense 向量</tspan></text>
  <text x="60" y="646" class="small">在内存里算距离 —— 所以<tspan class="cR" font-weight="700">向量没法一直加密着放</tspan>。</text>
  <text x="60" y="666" class="tiny cGray">能做的：把<tspan font-weight="700">文本块 chunk 加密存</tspan>，用时再解密拼 prompt（部分向量库已内置）。权衡：安全 ↑，但复杂度 / 延迟也 ↑。</text>

  <!-- ④ embedding inversion -->
  <text x="40" y="708" class="sec">④ 🧬 途径四：嵌入反演 / 向量重构（最前沿，也最反直觉）</text>
  <rect x="40" y="726" width="1020" height="72" rx="10" fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1.2"/>
  <text x="60" y="750" class="small"><tspan class="cR" font-weight="700">漏洞（关键理解）：</tspan>就算你把文本块加密了，那些"<tspan font-weight="700">必须不加密</tspan>"的 dense 向量本身也会泄密 —— 最新研究证明：</text>
  <text x="60" y="772" class="small"><tspan class="cR" font-weight="700">能从 dense 向量反推出原文</tspan>（embedding inversion）。换句话说：<tspan font-weight="700">黑客拿到未加密的向量 ≈ 拿到原文</tspan>。</text>
  <text x="60" y="792" class="tiny cGray">攻击门槛：需同时拿到库的读权限 + 用实验性技术反推；但确是真实隐患，且是当前研究热点。</text>

  <text x="40" y="822" class="small"><tspan class="cT" font-weight="700">缓解（都还在研究，且都会降检索性能）：</tspan></text>
  <text x="60" y="848" class="small">· 给向量<tspan font-weight="700">加噪声 noise</tspan>　· 对向量做<tspan font-weight="700">变换 transformation</tspan>　· <tspan font-weight="700">降维</tspan>（保留距离、模糊语义）。</text>

  <!-- ⑤ takeaway -->
  <text x="40" y="892" class="sec">⑤ 🧭 核心心法</text>
  <rect x="40" y="910" width="1020" height="62" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.2"/>
  <text x="60" y="936" class="small"><tspan font-weight="700">你的知识库多半含私密信息 → 必须理解并控制"它如何被访问"。</tspan></text>
  <text x="60" y="960" class="small">本课这些手段（认证 / 多租户 / on-prem / 加密 / 向量防反演）要和<tspan font-weight="700">更广的网络安全措施</tspan>一起用。</text>

  <!-- 📡 2026 intel -->
  <text x="40" y="1016" class="sec">📡 2026 最新情报（已联网核实 · 截至 2026-06）</text>

  <text x="40" y="1044" class="small">· <tspan class="cR" font-weight="700">🧬 嵌入反演已从"论文"走进"现实"，这是 2026 RAG 安全最大警钟：</tspan><tspan font-weight="700">vec2text</tspan> 等方法能高精度还原原文，<tspan x="60" dy="24">2026 新方法（条件掩码扩散 conditional masked diffusion）更快更准。2026-04 的研究一句定性 ——</tspan><tspan x="60" dy="24"><tspan class="cR" font-weight="700">"向量库被攻破，不只是元数据泄露；只要向量可反演，就等于全文明文泄露。"</tspan></tspan></text>

  <text x="40" y="1144" class="small">· <tspan class="cV" font-weight="700">🛡️ 防御侧已工程化：</tspan>主流向量库原生支持多租户 / RBAC —— Milvus 提供<tspan font-weight="700">库级 / 集合级 / 分区级</tspan>隔离，<tspan x="60" dy="24">Elasticsearch、Azure 也有"安全多租户 RAG"参考架构。最佳实践：<tspan font-weight="700">所有数据请求统一走一个 API 治理层</tspan>，权限在那里集中判。</tspan></text>

  <text x="40" y="1244" class="small">· <tspan class="cV" font-weight="700">📋 归类与本地化：</tspan>这些风险对应 <tspan font-weight="700">OWASP LLM Top 10</tspan> 的"敏感信息泄露"+"prompt 注入"；高敏感场景可<tspan x="60" dy="24">全程 on-prem 跑开源模型（Llama 等已足够成熟），把数据牢牢留在自己机房。</tspan></text>

  <text x="40" y="1336" class="small cV" font-weight="700">一句话：本课给的是"知识库防泄露清单"（套话/外发/被黑/反演）；2026 最大变化是嵌入反演被坐实 ——<tspan x="40" dy="24">别再把"向量"当脱敏数据，它更接近"可还原的原文"。防御重心 = 隔离 + 本地化 + 统一权限治理。</tspan></text>

  <text x="40" y="1424" class="small cGray">🧪 个人补充（非课件，接你的前端/安全经验，帮你彻底理解）：</text>
  <text x="40" y="1450" class="small cGray">① <tspan class="cR" font-weight="700">认证 / RBAC / 多租户</tspan> = 你早就熟的鉴权、权限、租户隔离，直接迁移。</text>
  <text x="40" y="1476" class="small cGray">② <tspan class="cR" font-weight="700">金句：拿"元数据过滤"当安全 ≈ 拿"前端隐藏按钮"当权限控制</tspan> —— 经典反面教材！真正的安全必须落在<tspan x="40" dy="24">　 数据层（独立租户），不能靠应用层的"过滤条件"这种软约束。</tspan></text>
  <text x="40" y="1528" class="small cGray">③ <tspan class="cR" font-weight="700">embedding ≠ 哈希，更像"可逆的有损压缩"</tspan> —— 嵌入反演说明：向量能被还原成原文，所以别把"存成向量"</text>
  <text x="40" y="1552" class="small cGray">　 误当成"脱敏"。这点和你做前端时"打码/掩码也可能被还原"的直觉一致。</text>
  <text x="40" y="1578" class="small cGray">④ <tspan class="cR" font-weight="700">on-prem = 自建机房 vs 用第三方 API</tspan>：数据极敏感时，把整条链路收回自己手里最稳。</text>
</svg>
