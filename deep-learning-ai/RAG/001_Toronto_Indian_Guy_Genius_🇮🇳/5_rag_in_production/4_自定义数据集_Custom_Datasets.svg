<svg width="1100" height="1540" viewBox="0 0 1100 1540" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    .title { font-size: 27px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 16px; fill: #555; }
    .sec { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
    .ctitle { font-size: 16px; font-weight: 700; }
    .small { font-size: 14px; fill: #444; }
    .tiny { font-size: 13px; fill: #555; }
    .badge { font-size: 14px; font-weight: 700; fill: #fff; }
    .code { font-family: "SF Mono","Menlo","Consolas",monospace; font-size: 13px; fill: #263238; }
    .en { font-style: italic; }
    /* color classes LAST */
    .w { fill: #fff; } .wg { fill: #CFD8DC; }
    .cV { fill: #1565C0; } .cT { fill: #00897B; } .cO { fill: #EF6C00; } .cP { fill: #8E24AA; }
    .cR { fill: #C62828; } .cG { fill: #2E7D32; } .cm { fill: #8E24AA; } .cGray { fill: #888; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#37474F" stroke-width="1.8" stroke-linecap="round"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="1540" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" class="title">自定义数据集 🗃️ <tspan font-size="17" fill="#666" class="en">Custom Datasets</tspan></text>
  <text x="40" y="76" class="subtitle">一句话本质：把系统<tspan class="cR" font-weight="700">处理过的真实 prompt + 旅程信息</tspan>攒成集合，既能复盘过去，也能拿真实数据跑实验、复现。</text>
  <text x="40" y="100" class="subtitle">它是把<tspan class="cV" font-weight="700">可观测性</tspan>变成<tspan class="cV" font-weight="700">持续改进飞轮</tspan>的燃料 —— 评估、调优都该围着真实流量转。</text>
  <line x1="40" y1="118" x2="1060" y2="118" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ① what + decision -->
  <text x="40" y="152" class="sec">① 🧾 是什么 &amp; 核心决策："该存哪些数据?"</text>
  <text x="40" y="180" class="small"><tspan font-weight="700">定义：</tspan>系统<tspan font-weight="700">处理过的 prompt</tspan> + 你<tspan font-weight="700">选择记录</tspan>的"旅程信息"（检索了哪些文档、重排前后顺序、改写器输出…）。</text>
  <text x="40" y="206" class="small">核心决策 —— <tspan font-weight="700">存什么?</tspan> 答案极简：<tspan class="cR" font-weight="700">你想评估什么，就存什么</tspan>。</text>

  <rect x="40" y="222" width="500" height="80" rx="10" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>
  <text x="60" y="248" class="ctitle cV">🔁 端到端评估 End-to-end</text>
  <text x="60" y="272" class="small">存<tspan font-weight="700">输入 prompt + 最终 response</tspan> 即可（默认就够），</text>
  <text x="60" y="292" class="small">能看整体表现、追踪"改提示→回答怎么变"。</text>

  <rect x="560" y="222" width="500" height="80" rx="10" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="580" y="248" class="ctitle cP">🧩 组件级评估 Component-level</text>
  <text x="580" y="272" class="small">还要存<tspan font-weight="700">每个组件的输入/输出</tspan>（检索器、重排</text>
  <text x="580" y="292" class="small">器、改写器、Router LLM…）。</text>

  <text x="40" y="328" class="small cGray">→ 于是日志表常有<tspan font-weight="700">几十列</tspan>：客户 ID、重排器筛过的文本块、Agentic 工作流里每个 Router LLM 的输出… 存得越宽，能从越多维度逐个组件分析。</text>

  <!-- ② real debugging case (vertical timeline) -->
  <text x="40" y="372" class="sec">② 🛠️ 真实案例：图表质量差，怎么靠日志一路定位到根因（讲师亲历）</text>
  <line x1="66" y1="400" x2="66" y2="560" stroke="#B0BEC5" stroke-width="2"/>
  <circle cx="66" cy="408" r="13" fill="#546E7A"/><text x="66" y="413" class="badge" text-anchor="middle">1</text>
  <text x="92" y="413" class="small"><tspan class="cT" font-weight="700">背景 Context：</tspan>客户反馈"生成的图表质量很低"。</text>
  <circle cx="66" cy="446" r="13" fill="#546E7A"/><text x="66" y="451" class="badge" text-anchor="middle">2</text>
  <text x="92" y="451" class="small"><tspan class="cT" font-weight="700">查日志 Log Analysis：</tspan>回溯日志，检查用户<tspan font-weight="700">实际提交的 prompt</tspan>。</text>
  <circle cx="66" cy="484" r="13" fill="#546E7A"/><text x="66" y="489" class="badge" text-anchor="middle">3</text>
  <text x="92" y="489" class="small"><tspan class="cT" font-weight="700">锁定环节 Router LLM：</tspan>路由器负责把 prompt 发到正确组件 —— 嫌疑就在这。</text>
  <circle cx="66" cy="522" r="13" fill="#E53935"/><text x="66" y="527" class="badge" text-anchor="middle">4</text>
  <text x="92" y="527" class="small"><tspan class="cR" font-weight="700">问题 Problem：</tspan>Router 把"画个图"误判，发给了<tspan font-weight="700">文生图 diffusion 模型</tspan>（擅长画人/物，不擅长图表）。</text>
  <circle cx="66" cy="560" r="13" fill="#2E7D32"/><text x="66" y="565" class="badge" text-anchor="middle">5</text>
  <text x="92" y="565" class="small"><tspan class="cG" font-weight="700">解决 Solution：</tspan>改 Router 的<tspan font-weight="700">系统提示</tspan> → 把画图请求路由到<tspan font-weight="700">代码图表生成器（Mermaid.js）</tspan>。</text>
  <text x="92" y="592" class="tiny cGray">→ 正因监控/日志健全，收到反馈后能快速定位并把修复推上线。这就是可观测性的价值。</text>

  <!-- ③ example analysis: topic -> component drill down -->
  <text x="40" y="636" class="sec">③ 🔬 下钻分析：从"主题级"钻到"组件级"找根因</text>
  <rect x="40" y="654" width="470" height="180" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.2"/>
  <text x="275" y="678" class="ctitle" text-anchor="middle">① 主题级表现 Topic Performance</text>
  <rect x="62" y="692" width="426" height="26" rx="6" fill="#546E7A"/><text x="74" y="710" class="small w">92%　退款 Refunds</text>
  <rect x="62" y="724" width="426" height="26" rx="6" fill="#546E7A"/><text x="74" y="742" class="small w">87%　账户设置 Account Setup</text>
  <rect x="62" y="756" width="426" height="26" rx="6" fill="#546E7A"/><text x="74" y="774" class="small w">84%　产品功能 Product Features</text>
  <rect x="62" y="788" width="426" height="26" rx="6" fill="#EF5350" stroke="#37474F" stroke-width="1.3" stroke-dasharray="5 3"/><text x="74" y="806" class="small w" font-weight="700">58%　产品延迟 Product Delays ← 异常</text>

  <line x1="514" y1="744" x2="552" y2="744" stroke="#37474F" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="533" y="730" class="tiny cGray" text-anchor="middle">下钻</text>

  <rect x="560" y="654" width="500" height="180" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.2"/>
  <text x="810" y="678" class="ctitle" text-anchor="middle">② 组件级表现 Component Performance</text>
  <rect x="580" y="690" width="460" height="28" rx="6" fill="#FFEBEE"/><text x="592" y="709" class="small">🎯 上下文精度 Context Precision　<tspan class="cR" font-weight="700">42% 偏低</tspan></text>
  <rect x="580" y="724" width="460" height="28" rx="6" fill="#FFEBEE"/><text x="592" y="743" class="small">📉 回答相关性 Answer Relevance　<tspan class="cR" font-weight="700">55% 偏低</tspan></text>
  <rect x="580" y="758" width="460" height="28" rx="6" fill="#E8F5E9"/><text x="592" y="777" class="small">✅ 忠实度 Faithfulness　<tspan class="cG" font-weight="700">68% 尚可</tspan></text>
  <rect x="580" y="792" width="460" height="28" rx="6" fill="#FFEBEE"/><text x="592" y="811" class="small">📚 检索块数 Chunks Retrieved　<tspan class="cR" font-weight="700">1.5 偏低</tspan></text>

  <text x="40" y="862" class="small"><tspan class="cR" font-weight="700">根因链：</tspan>"产品延迟"主题回答差（58%）→ 钻进组件看：<tspan font-weight="700">检索器找不到足够相关文档</tspan>（精度/块数都低）→ <tspan class="cG" font-weight="700">解法：往知识库补料</tspan>。</text>

  <!-- ④ visualizing / clustering -->
  <text x="40" y="906" class="sec">④ 📊 可视化与聚类：看高层趋势</text>
  <text x="40" y="934" class="small">· 数据量一大就该<tspan font-weight="700">可视化</tspan>，看整体/各组件的高层趋势，而非只盯单条 prompt。</text>
  <text x="40" y="960" class="small">· 用<tspan font-weight="700">聚类 clustering</tspan>把海量 prompt 自动归成主题（如"产品发布""排障问题"），再<tspan font-weight="700">对每个簇单独跑评估</tspan>，发现"哪类问题系统表现差"。</text>

  <!-- ⑤ the loop + massive -->
  <text x="40" y="1004" class="sec">⑤ ♻️ 一条龙闭环 &amp; 一个提醒</text>
  <rect x="40" y="1022" width="1020" height="48" rx="10" fill="#37474F"/>
  <text x="60" y="1051" class="small w" font-weight="700">建对了可观测体系，就能：检测问题 → 定位根因 → 确认修复真的有效（围着真实 prompt 持续个性化你的 RAG）。</text>
  <text x="40" y="1096" class="small cGray">⚠️ 提醒：组件级数据越存越细，<tspan font-weight="700">数据集会爆炸式增大</tspan>（轻松几十列、海量行）—— 要权衡"存多少"与"评什么"。</text>

  <!-- 📡 2026 intel -->
  <text x="40" y="1140" class="sec">📡 2026 最新情报（已联网核实 · 截至 2026-06）</text>

  <text x="40" y="1168" class="small">· <tspan class="cV" font-weight="700">🏆 课件的"自定义数据集"，2026 有个正式名：黄金数据集 Golden Dataset。</tspan>它是<tspan font-weight="700">版本化、带丰富</tspan><tspan x="60" dy="24">元数据</tspan>的"输入 + 上下文 + 期望输出"集合，是衡量质量的<tspan class="cR" font-weight="700">唯一真值 source of truth</tspan>；每次实验都跟它对比。</text>

  <text x="40" y="1240" class="small">· <tspan class="cV" font-weight="700">🔄 怎么喂养它（呼应本课"从日志攒"）：</tspan>2026 做法是<tspan font-weight="700">直接从生产日志 + 失败案例</tspan>持续回灌，<tspan x="60" dy="24">在产品内就地策展 curation；也可用 <tspan font-weight="700">RAGAS TestsetGenerator</tspan> 从你的文档自动<tspan font-weight="700">合成</tspan>问/答/上下文起步。</tspan></text>

  <text x="40" y="1312" class="small">· <tspan class="cV" font-weight="700">⏳ 别让它过期：</tspan>领域一变，旧基准会迅速失效 —— 要做<tspan font-weight="700">滚动更新 + 定期注入新真实数据</tspan>。<tspan x="60" dy="24">配合<tspan font-weight="700">嵌入聚类 / 漂移监控</tspan>，正是本课"聚类找主题趋势"的 2026 升级版。</tspan></text>

  <text x="40" y="1404" class="small cV" font-weight="700">一句话：本课的"自定义数据集"就是 2026 评估体系的地基（golden dataset）；新增的只是"持续从生产回灌 +<tspan x="40" dy="24">合成补充 + 防过期"这套数据飞轮工程。框架没变，运营更自动化了。</tspan></text>

  <text x="40" y="1476" class="small cGray">🧪 个人补充（非课件）：对你（前端）最贴切的类比 —— 这就是<tspan class="cR" font-weight="700">"用真实流量回放做回归测试" + 埋点 BI 看板下钻</tspan>。<tspan x="40" dy="24">主题聚类 ≈ 你做的用户行为分群；组件级下钻 ≈ 从"页面整体慢"钻到"哪个接口慢"。把它做成数据飞轮，系统就能越用越准。</tspan></text>
</svg>
