  <!-- totals explanation (right of table) -->
  <text x="620" y="486" class="ct cTeal">📐 Three kinds of totals to add</text>
  <text x="620" y="510" class="b">🔹 <tspan class="bb">Row totals</tspan> (right column) = each MONTH added across all 4 years.</text>
  <text x="620" y="532" class="b">　 These match the one-way table exactly (JAN = $28,361).</text>
  <text x="620" y="558" class="b">🔹 <tspan class="bb">Column totals</tspan> (bottom row) = each YEAR added across all months.</text>
  <text x="620" y="584" class="b">🔹 <tspan class="bb">Grand total</tspan> (bottom-right corner) = the whole table = <tspan class="cOrange bb">$273,610</tspan>.</text>

  <rect x="620" y="606" width="500" height="92" rx="11" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="638" y="630" class="ct cGreen">👀 Now you can read BOTH directions</text>
  <text x="638" y="654" class="b">Best <tspan class="bb">month</tspan> = November ($48,055) — still visible, like before.</text>
  <text x="638" y="676" class="b">Best <tspan class="bb">year</tspan> = 2017 ($161,297) — this is NEW; the one-way</text>
  <text x="638" y="694" class="b">　 table could never show it.</text>

  <text x="620" y="730" class="b"><tspan class="bb">Why it matters:</tspan> the one-way table flattens all 4 years</text>
  <text x="620" y="752" class="b">into one number per month, so it hides the year-over-year</text>
  <text x="620" y="774" class="b">growth. The two-way grid keeps both stories side by side.</text>

  <!-- ③ comparison line graph -->
  <text x="40" y="870" class="sec">📈 Graphing two-way data: one colored line per year</text>
  <text x="40" y="898" class="b">Because each value depends on two things, we put <tspan class="bb">month</tspan> on the bottom axis and draw a <tspan class="bb">separate colored line for each year</tspan>.</text>
  <text x="40" y="920" class="b">Stacking the four years makes the growth jump out: each year's line sits clearly above the year before it.</text>

