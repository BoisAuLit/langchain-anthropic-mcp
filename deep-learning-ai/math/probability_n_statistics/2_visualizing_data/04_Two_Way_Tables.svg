  <text x="40" y="1278" class="b">👀 <tspan class="bb">Read it:</tspan> 2017 (top, dark line) towers over 2014 (bottom, almost flat on the floor). The big November spike repeats</text>
  <text x="40" y="1300" class="b">every single year — and gets taller each time. That year-over-year story is exactly what the two independent variables give you.</text>

  <!-- ④ recap (lesson content) -->
  <rect x="40" y="1338" width="1080" height="118" rx="12" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.4"/>
  <text x="60" y="1364" class="ct cPurple">🧭 One-way vs two-way — the core idea</text>
  <text x="60" y="1388" class="b">· <tspan class="bb">One-way table</tspan> → values depend on ONE independent variable (e.g. month); you can ask only one question.</text>
  <text x="60" y="1410" class="b">· <tspan class="bb">Two-way table</tspan> → values depend on TWO (month × year); each cell is the crossing of a row and a column.</text>
  <text x="60" y="1432" class="b">· Add <tspan class="bb">row totals, column totals, and a grand total</tspan> to read every monthly, yearly, and overall summary at once.</text>
</svg>
