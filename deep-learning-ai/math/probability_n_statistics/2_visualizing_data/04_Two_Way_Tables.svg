  <rect x="0" y="0" width="1160" height="1480" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" class="title">Two-Way Tables 🗂️ — when each value depends on TWO things</text>
  <text x="40" y="76" class="ess">A one-way table organizes data by <tspan class="bb">one</tspan> category. A <tspan class="cPink bb">two-way table</tspan> organizes it by <tspan class="bb">two</tspan> categories at once (a grid),</text>
  <text x="40" y="98" class="ess">so every value sits at the crossing of a row and a column. You can also total it by row, by column, and overall.</text>
  <line x1="40" y1="114" x2="1120" y2="114" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ① one-way vs two-way concept -->
  <text x="40" y="148" class="sec">🔢 One-way vs two-way: how many things does each value depend on?</text>
  <text x="40" y="176" class="b">Vocabulary first: the <tspan class="bb">independent variable</tspan> = the category you organize by (the "individuals"). The <tspan class="bb">dependent</tspan></text>
  <text x="40" y="198" class="b"><tspan class="bb">variable</tspan> = the value that responds to it (here, the revenue). A one-way table has one independent variable; a two-way table has two.</text>

  <rect x="40" y="216" width="540" height="150" rx="11" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="58" y="240" class="ct cBlue">1️⃣ One-way table — depends on 1 thing</text>
  <text x="58" y="264" class="b">Months down the side, revenue across. Revenue depends only on the MONTH.</text>
  <text x="58" y="286" class="b">The only question you can ask: "how much in February?"</text>
  <text x="58" y="308" class="b">Independent variable = month. Dependent variable = revenue.</text>
  <text x="58" y="332" class="b cBlue">Question needs 1 answer:　month → revenue</text>
  <text x="58" y="354" class="sm">(this is the one-way table from the earlier lesson)</text>

  <rect x="600" y="216" width="520" height="150" rx="11" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
  <text x="618" y="240" class="ct cOrange">2️⃣ Two-way table — depends on 2 things</text>
  <text x="618" y="264" class="b">Months down the side, YEARS across the top. Revenue depends on BOTH.</text>
  <text x="618" y="286" class="b">Now you must ask: "which month AND which year?"</text>
  <text x="618" y="308" class="b">Two independent variables = month + year. Dependent = revenue.</text>
  <text x="618" y="332" class="b cOrange">Question needs 2 answers:　month + year → revenue</text>
  <text x="618" y="354" class="sm">each cell sits at the crossing of a month and a year</text>

  <!-- ② the two-way table -->
  <text x="40" y="410" class="sec">🗓️ The two-way table — month × year, with totals</text>
  <text x="40" y="438" class="b">An artist sold paintings 2014–2017, growing every year. Splitting revenue by month AND year reveals the growth a one-way table hides.</text>

