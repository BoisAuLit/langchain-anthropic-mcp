<svg width="1160" height="1486" viewBox="0 0 1160 1486" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
    .title { font-size: 25px; font-weight: 800; fill: #0F172A; }
    .ess { font-size: 16px; fill: #475569; }
    .sec { font-size: 19px; font-weight: 800; fill: #0F172A; }
    .b { font-size: 15px; fill: #334155; }
    .bb { font-size: 15px; font-weight: 700; }
    .sm { font-size: 13px; fill: #64748B; }
    .ct { font-size: 15px; font-weight: 700; }
    .td { font-size: 13.5px; fill: #334155; }
    .tdb { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
    .th { font-size: 13.5px; font-weight: 700; fill: #334155; }
    .vnum { font-size: 26px; font-weight: 800; }
    .vlab { font-size: 16px; font-weight: 800; }
    /* color classes LAST */
    .w{fill:#fff} .wg{fill:#CBD5E1}
    .cBlue{fill:#2563EB} .cTeal{fill:#0D9488} .cOrange{fill:#EA580C} .cPurple{fill:#7C3AED}
    .cPink{fill:#E11D48} .cGreen{fill:#16A34A} .cAmber{fill:#CA8A04} .cSlate{fill:#334155} .cGray{fill:#94A3B8}
  </style>

  <rect x="0" y="0" width="1160" height="1486" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" class="title">Venn Diagrams 🔵🔴 — picturing two-way data as overlapping circles</text>
  <text x="40" y="76" class="ess">A Venn diagram shows the <tspan class="bb">same data as a two-way table</tspan>, but as circles. Each region (only-this, only-that, both,</text>
  <text x="40" y="98" class="ess">neither) is one yes/no combination. The <tspan class="cPink bb">overlap</tspan> is the key idea: items that meet BOTH conditions.</text>
  <line x1="40" y1="114" x2="1120" y2="114" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ① two-way table → venn -->
  <text x="40" y="148" class="sec">🍪 Start from the two-way table you already know</text>
  <text x="40" y="176" class="b">16 Christmas cookies, each maybe dipped in <tspan class="bb">frosting</tspan> and/or covered in <tspan class="bb">sprinkles</tspan>. First, the two-way table with totals:</text>

  <!-- mini two-way table -->
  <rect x="40" y="196" width="120" height="26" fill="#FED7AA"/>
  <rect x="160" y="196" width="100" height="26" fill="#FED7AA"/>
  <rect x="260" y="196" width="120" height="26" fill="#FED7AA"/>
  <rect x="380" y="196" width="80" height="26" fill="#FED7AA"/>
  <text x="210" y="214" class="th" text-anchor="middle">Sprinkles</text>
  <text x="320" y="214" class="th" text-anchor="middle">No sprinkles</text>
  <text x="420" y="214" class="th" text-anchor="middle">Total</text>
  <rect x="40" y="222" width="420" height="26" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="52" y="240" class="td">Frosting</text>
  <text x="210" y="240" class="td" text-anchor="middle">4</text>
  <text x="320" y="240" class="td" text-anchor="middle">5</text>
  <text x="420" y="240" class="tdb" text-anchor="middle">9</text>
  <rect x="40" y="248" width="420" height="26" fill="#ffffff" stroke="#FDE68A"/>
  <text x="52" y="266" class="td">No frosting</text>
  <text x="210" y="266" class="td" text-anchor="middle">3</text>
  <text x="320" y="266" class="td" text-anchor="middle">4</text>
  <text x="420" y="266" class="tdb" text-anchor="middle">7</text>
  <rect x="40" y="274" width="420" height="28" fill="#FDE9D6" stroke="#FDBA74"/>
  <text x="52" y="293" class="tdb">Total</text>
  <text x="210" y="293" class="tdb" text-anchor="middle">7</text>
  <text x="320" y="293" class="tdb" text-anchor="middle">9</text>
  <text x="420" y="293" class="tdb" text-anchor="middle">16</text>

  <!-- mapping note -->
  <text x="500" y="216" class="ct cBlue">Each table cell becomes a region of the Venn</text>
  <text x="500" y="240" class="b">🔸 Frosting + Sprinkles = 4 → the <tspan class="bb">OVERLAP</tspan> (both conditions).</text>
  <text x="500" y="262" class="b">🔸 Frosting + No sprinkles = 5 → frosting circle <tspan class="bb">ONLY</tspan>.</text>
  <text x="500" y="284" class="b">🔸 No frosting + Sprinkles = 3 → sprinkles circle <tspan class="bb">ONLY</tspan>.</text>
  <text x="500" y="306" class="b">🔸 No frosting + No sprinkles = 4 → <tspan class="bb">OUTSIDE</tspan> both (in the box).</text>

  <!-- ② the two-circle venn -->
  <text x="40" y="352" class="sec">⭕ The two-circle Venn — drawn and decoded</text>
  <text x="40" y="380" class="b">The red circle = cookies with frosting; the gray circle = cookies with sprinkles. Where they overlap = both at once.</text>

  <!-- venn box -->
  <rect x="40" y="398" width="540" height="300" rx="12" fill="#FBF7EF" stroke="#E2D9C5" stroke-width="1.4"/>
  <circle cx="218" cy="558" r="118" fill="#F08A6E" fill-opacity="0.22" stroke="#EA580C" stroke-width="2"/>
  <circle cx="368" cy="558" r="118" fill="#94A3B8" fill-opacity="0.20" stroke="#64748B" stroke-width="2"/>
  <text x="150" y="432" class="vlab cOrange">Frosting</text>
  <text x="430" y="432" class="vlab cSlate">Sprinkles</text>
  <text x="158" y="568" class="vnum cOrange" text-anchor="middle">5</text>
  <text x="293" y="568" class="vnum cPurple" text-anchor="middle">4</text>
  <text x="428" y="568" class="vnum cSlate" text-anchor="middle">3</text>
  <text x="528" y="672" class="vnum cSlate" text-anchor="middle">4</text>
  <text x="528" y="690" class="sm cSlate" text-anchor="middle">neither</text>

  <!-- right: read regions + sums -->
  <text x="620" y="428" class="ct cTeal">Read each region</text>
  <text x="620" y="452" class="b">🔴 <tspan class="bb">5</tspan> in the red-only part → 5 cookies have frosting but NO sprinkles.</text>
  <text x="620" y="474" class="b">⚪ <tspan class="bb">3</tspan> in the gray-only part → 3 cookies have sprinkles but NO frosting.</text>
  <text x="620" y="496" class="b">🟣 <tspan class="bb">4</tspan> in the overlap → 4 cookies have BOTH frosting and sprinkles.</text>
  <text x="620" y="518" class="b">⬜ <tspan class="bb">4</tspan> in the corner (outside both) → 4 cookies have NEITHER.</text>

  <rect x="620" y="540" width="500" height="158" rx="11" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="638" y="564" class="ct cBlue">Add regions to answer any question</text>
  <text x="638" y="588" class="b">· Frosting total = 5 + 4 = <tspan class="bb">9</tspan>　(red-only + overlap)</text>
  <text x="638" y="610" class="b">· Sprinkles total = 4 + 3 = <tspan class="bb">7</tspan>　(overlap + gray-only)</text>
  <text x="638" y="632" class="b">· At least one (frosting OR sprinkles) = 5 + 4 + 3 = <tspan class="bb">12</tspan></text>
  <text x="638" y="654" class="b">· Everything = 5 + 4 + 3 + 4 = <tspan class="bb">16</tspan></text>
  <text x="638" y="680" class="b cGreen">✓ Every one of these matches the two-way table.</text>

  <!-- ③ build rule -->
  <text x="40" y="738" class="sec">🧩 The rule for building any Venn diagram</text>
  <rect x="40" y="756" width="1080" height="96" rx="11" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="58" y="782" class="b">🔹 Items meeting <tspan class="bb">ONLY one</tspan> condition → that circle alone.　🔹 Items meeting <tspan class="bb">BOTH</tspan> → the overlap in the middle.</text>
  <text x="58" y="804" class="b">🔹 Items meeting <tspan class="bb">NEITHER</tspan> → outside all circles, but still inside the box.</text>
  <text x="58" y="830" class="b">👉 The box (rectangle) stands for <tspan class="bb">EVERYTHING</tspan> (all 16 cookies); the number in the corner is the "neither" leftover.</text>

  <!-- ④ variations + 3-circle -->
  <text x="40" y="892" class="sec">🔧 Variations: proportional circles, and three circles</text>
  <text x="40" y="920" class="b">Two handy variations: <tspan class="bb">(1)</tspan> make each circle's SIZE proportional to its count (frosting : sprinkles = 9 : 7, so the frosting</text>
  <text x="40" y="942" class="b">circle is drawn a bit bigger). <tspan class="bb">(2)</tspan> Use THREE circles for three conditions. A survey asked students about pets — dogs, cats, birds:</text>

  <!-- three-circle venn box -->
  <rect x="40" y="960" width="560" height="334" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.4"/>
  <circle cx="320" cy="1072" r="92" fill="#E0A82E" fill-opacity="0.18" stroke="#CA8A04" stroke-width="2"/>
  <circle cx="262" cy="1166" r="92" fill="#93C5FD" fill-opacity="0.22" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="378" cy="1166" r="92" fill="#94A3B8" fill-opacity="0.24" stroke="#475569" stroke-width="2"/>
  <text x="250" y="998" class="vlab cAmber">Dogs</text>
  <text x="150" y="1252" class="vlab cBlue">Birds</text>
  <text x="470" y="1252" class="vlab cSlate">Cats</text>
  <text x="320" y="1040" class="vnum cAmber" text-anchor="middle">2</text>
  <text x="206" y="1182" class="vnum cBlue" text-anchor="middle">1</text>
  <text x="434" y="1182" class="vnum cSlate" text-anchor="middle">3</text>
  <text x="268" y="1112" class="vnum cGreen" text-anchor="middle">3</text>
  <text x="372" y="1112" class="vnum cGreen" text-anchor="middle">5</text>
  <text x="320" y="1200" class="vnum cGreen" text-anchor="middle">4</text>
  <text x="320" y="1146" class="vnum cPurple" text-anchor="middle">6</text>
  <text x="560" y="1278" class="vnum cSlate" text-anchor="middle">7</text>

  <!-- right: 3-circle reading -->
  <text x="640" y="990" class="ct cPurple">Seven regions + the leftover</text>
  <text x="640" y="1016" class="b">🟡 Dogs only = <tspan class="bb">2</tspan>　🔵 Birds only = <tspan class="bb">1</tspan>　⚫ Cats only = <tspan class="bb">3</tspan></text>
  <text x="640" y="1042" class="b">Dogs &amp; Birds, not cats = <tspan class="bb">3</tspan>　(left overlap)</text>
  <text x="640" y="1064" class="b">Dogs &amp; Cats, not birds = <tspan class="bb">5</tspan>　(right overlap)</text>
  <text x="640" y="1086" class="b">Birds &amp; Cats, not dogs = <tspan class="bb">4</tspan>　(bottom overlap)</text>
  <text x="640" y="1108" class="b">All three — dogs, cats &amp; birds = <tspan class="bb">6</tspan>　(center)</text>
  <text x="640" y="1130" class="b">None of them = <tspan class="bb">7</tspan>　(outside, in the corner)</text>

  <rect x="640" y="1152" width="480" height="74" rx="11" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="658" y="1178" class="b">Total students = 2 + 1 + 3 + 3 + 5 + 4 + 6 + 7 = <tspan class="bb">31</tspan></text>
  <text x="658" y="1202" class="b">Each region is a separate group → <tspan class="bb">no student is counted twice</tspan>.</text>

  <!-- ⑤ recap -->
  <rect x="40" y="1334" width="1080" height="118" rx="12" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.4"/>
  <text x="60" y="1360" class="ct cPurple">🧭 Venn diagrams — the core idea</text>
  <text x="60" y="1384" class="b">· A Venn diagram redraws two-way-table data as overlapping circles: each region = one yes/no combination.</text>
  <text x="60" y="1406" class="b">· Overlap = items meeting BOTH conditions; outside the circles (but in the box) = items meeting NEITHER.</text>
  <text x="60" y="1428" class="b">· Add up regions to get any total (one condition, the other, at least one, or everything) — they all match the table.</text>
</svg>
