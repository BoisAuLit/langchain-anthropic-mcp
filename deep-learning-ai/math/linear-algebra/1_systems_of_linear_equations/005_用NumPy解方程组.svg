<svg width="900" height="1030" viewBox="0 0 900 1030" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    .title { font-size: 30px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 16px; fill: #666; }
    .sec { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
    .body { font-size: 15px; fill: #333; }
    .small { font-size: 14px; fill: #444; }
    .tiny { font-size: 13px; fill: #555; }
    .code { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 14px; fill: #333; }
    .cell { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 13px; fill: #333; }
    .cap { font-size: 15px; font-weight: 700; }
    .axis { stroke: #90CAF9; stroke-width: 1.5; }
    .ln { stroke: #1a1a1a; stroke-width: 2; fill: none; }
    .gridline { stroke: #999; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#999" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1030" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="52" class="title">Lab 总结：用 NumPy 把方程组变成矩阵并求解</text>
  <text x="40" y="84" class="subtitle">C1_W1_Lab_2 —— 前几节理论课的代码实操版：solve 解方程、det 验奇异、hstack 拼增广矩阵。</text>
  <line x1="40" y1="102" x2="860" y2="102" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ① tools -->
  <text x="40" y="140" class="sec">① 本 Lab 的核心新工具（np.linalg 线性代数包）</text>
  <text x="60" y="170" class="code">A = np.array([[-1, 3], [3, 2]], dtype=float)  # 系数矩阵, shape (2, 2)</text>
  <text x="60" y="196" class="code">b = np.array([7, 1], dtype=float)             # 常数向量, shape (2,)</text>
  <text x="60" y="222" class="code" font-weight="700">x = np.linalg.solve(A, b)  →  [-1.  2.]      # 一行解出方程组！</text>
  <text x="60" y="248" class="code" font-weight="700">d = np.linalg.det(A)       →  -11.00         # 一行算出行列式</text>
  <text x="40" y="280" class="small" fill="#1565C0" font-weight="700">对应理论：det = −11 ≠ 0 → 非奇异 → 必有唯一解 → solve 给出 x₁ = −1, x₂ = 2。好习惯：先 det 体检，再 solve 求解。</text>

  <!-- ② augmented -->
  <text x="40" y="324" class="sec">② 增广矩阵：把 A 和 b 拼成一张"完整账单"</text>
  <text x="60" y="354" class="code">A_system = np.hstack((A, b.reshape((2, 1))))</text>
  <text x="60" y="380" class="code">A_system[1]  →  [3. 2. 1.]   # 抽出第二行 = 第二个方程</text>
  <text x="40" y="410" class="small">为什么要 reshape？b 的 shape 是 (2,)，是"躺着的"一维数组；得先立起来变成 (2,1) 的列，才能横向拼接。</text>
  <text x="40" y="434" class="tiny">（上个 notebook 学的 hstack 和 reshape，在这里派上了真用场。）</text>

  <!-- visual: A | b -> [A|b] -->
  <rect x="620" y="330" width="60" height="60" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <line x1="650" y1="330" x2="650" y2="390" class="gridline"/>
  <line x1="620" y1="360" x2="680" y2="360" class="gridline"/>
  <text x="635" y="350" class="cell" text-anchor="middle">-1</text><text x="665" y="350" class="cell" text-anchor="middle">3</text>
  <text x="635" y="380" class="cell" text-anchor="middle">3</text><text x="665" y="380" class="cell" text-anchor="middle">2</text>
  <rect x="690" y="330" width="30" height="60" fill="#E0F2F1" stroke="#26A69A" stroke-width="1.5"/>
  <line x1="690" y1="360" x2="720" y2="360" class="gridline"/>
  <text x="705" y="350" class="cell" text-anchor="middle">7</text>
  <text x="705" y="380" class="cell" text-anchor="middle">1</text>
  <line x1="728" y1="360" x2="750" y2="360" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="758" y="330" width="90" height="60" fill="#F5F5F5" stroke="#888" stroke-width="1.5"/>
  <line x1="788" y1="330" x2="788" y2="390" class="gridline"/>
  <line x1="818" y1="330" x2="818" y2="390" class="gridline"/>
  <line x1="758" y1="360" x2="848" y2="360" class="gridline"/>
  <text x="773" y="350" class="cell" text-anchor="middle">-1</text><text x="803" y="350" class="cell" text-anchor="middle">3</text><text x="833" y="350" class="cell" text-anchor="middle">7</text>
  <text x="773" y="380" class="cell" text-anchor="middle">3</text><text x="803" y="380" class="cell" text-anchor="middle">2</text><text x="833" y="380" class="cell" text-anchor="middle">1</text>
  <text x="668" y="412" class="tiny" text-anchor="middle">A　＋　b</text>
  <text x="803" y="412" class="tiny" text-anchor="middle" fill="#1565C0">增广矩阵 [A | b]</text>

  <!-- ③ three systems -->
  <text x="40" y="478" class="sec">③ 同一段代码，三种命运（Lab 的核心实验）</text>

  <!-- Card 1 -->
  <rect x="40" y="496" width="260" height="300" rx="12" fill="#F1F8E9" stroke="#AED581" stroke-width="1.5"/>
  <text x="58" y="524" class="cap" fill="#2E7D32">System 1 · 唯一解</text>
  <text x="58" y="550" class="cell">-x₁ + 3x₂ = 7</text>
  <text x="58" y="572" class="cell"> 3x₁ + 2x₂ = 1</text>
  <text x="58" y="600" class="cell" font-weight="700" fill="#2E7D32">det = -11 ≠ 0</text>
  <!-- plot cx=170 cy=675 -->
  <line x1="65" y1="675" x2="275" y2="675" class="axis"/>
  <line x1="170" y1="620" x2="170" y2="728" class="axis"/>
  <line x1="85" y1="678" x2="255" y2="622" class="ln"/>
  <line x1="125" y1="615" x2="190" y2="702" class="ln"/>
  <circle cx="155" cy="655" r="4.5" fill="#1a1a1a"/>
  <text x="166" y="648" class="tiny" font-weight="700">(-1, 2)</text>
  <text x="58" y="752" class="small" font-weight="700" fill="#1565C0">solve → (-1, 2)，一击命中</text>
  <rect x="58" y="764" width="180" height="22" rx="11" fill="#2E7D32"/>
  <text x="148" y="779" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Non-singular · 恰好 1 解</text>

  <!-- Card 2 -->
  <rect x="320" y="496" width="260" height="300" rx="12" fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1.5"/>
  <text x="338" y="524" class="cap" fill="#C62828">System 2 · 无解</text>
  <text x="338" y="550" class="cell">-x₁ + 3x₂ = 7</text>
  <text x="338" y="572" class="cell"> 3x₁ - 9x₂ = 1</text>
  <text x="338" y="600" class="cell" font-weight="700" fill="#C62828">det = 0.00</text>
  <!-- plot cx=450 cy=675 -->
  <line x1="345" y1="675" x2="555" y2="675" class="axis"/>
  <line x1="450" y1="620" x2="450" y2="728" class="axis"/>
  <line x1="365" y1="683" x2="535" y2="626" class="ln"/>
  <line x1="365" y1="715" x2="535" y2="658" class="ln"/>
  <text x="338" y="752" class="small" font-weight="700" fill="#C62828">solve → 直接报错！LinAlgError:</text>
  <text x="338" y="770" class="cell" fill="#C62828">"Singular matrix"</text>
  <rect x="338" y="764" width="0" height="0" fill="none"/>
  <rect x="468" y="752" width="0" height="0" fill="none"/>
  <rect x="338" y="776" width="170" height="0" fill="none"/>
  <text x="338" y="790" class="tiny">两线平行，永不相遇 → 0 个解</text>

  <!-- Card 3 -->
  <rect x="600" y="496" width="260" height="300" rx="12" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="618" y="524" class="cap" fill="#F57F17">System 3 · 无穷多解</text>
  <text x="618" y="550" class="cell">-x₁ + 3x₂ = 7</text>
  <text x="618" y="572" class="cell"> 3x₁ - 9x₂ = -21</text>
  <text x="618" y="600" class="cell" font-weight="700" fill="#F57F17">det = 0.00（A 没变！）</text>
  <!-- plot cx=730 cy=675 -->
  <line x1="625" y1="675" x2="835" y2="675" class="axis"/>
  <line x1="730" y1="620" x2="730" y2="728" class="axis"/>
  <line x1="645" y1="700" x2="815" y2="643" class="ln" stroke-width="3"/>
  <circle cx="675" cy="690" r="3.5" fill="#1a1a1a"/>
  <circle cx="710" cy="678" r="3.5" fill="#1a1a1a"/>
  <circle cx="745" cy="667" r="3.5" fill="#1a1a1a"/>
  <circle cx="780" cy="655" r="3.5" fill="#1a1a1a"/>
  <text x="618" y="752" class="small" font-weight="700" fill="#1565C0">第 2 行化简后：0 = 0（废话）</text>
  <text x="618" y="774" class="cell">解：x₁ = 3x₂ - 7，x₂ 随便取</text>
  <text x="618" y="790" class="tiny">两线完全重合 → ∞ 个解</text>

  <!-- ④ verified -->
  <text x="40" y="844" class="sec">④ 这个 Lab 用代码验证了理论课的全部论断</text>
  <text x="40" y="872" class="small">· System 2 和 3 的 A 一模一样（det 都是 0），一个无解、一个无穷多 —— b 只决定走哪条路，不影响奇异性 ✓</text>
  <text x="40" y="898" class="small">· np.linalg.solve 只伺候非奇异矩阵；遇到 det = 0 直接抛 LinAlgError —— 不是它笨，是"唯一解"根本不存在 ✓</text>
  <text x="40" y="924" class="small">· 冗余方程化简后变成 0 = 0：一句零信息量的废话，所以剩一条线、无穷多解 ✓</text>
  <text x="40" y="950" class="small">· 解的个数仍只有三种：0、1、∞ —— 代码、几何、理论三方对账，全部吻合 ✓</text>

  <line x1="40" y1="976" x2="860" y2="976" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="1000" class="tiny" fill="#888" font-size="12">速记：先 det 体检，再 solve 求解 —— det = 0 时 solve 必报 "Singular matrix"。拼增广矩阵用 hstack，记得先把 b reshape((2,1)) 立成列。</text>
</svg>
