<svg width="900" height="1840" viewBox="0 0 900 1840" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    .title { font-size: 29px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 16px; fill: #666; }
    .sec { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
    .body { font-size: 15px; fill: #333; }
    .small { font-size: 14px; fill: #444; }
    .tiny { font-size: 13px; fill: #555; }
    .code { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 14px; fill: #1B5E20; }
    .cell { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 14px; fill: #333; }
    .chip { fill: #E8F5E9; stroke: #A5D6A7; stroke-width: 1; }
    .axis { stroke: #90CAF9; stroke-width: 1.5; }
    .gridline { stroke: #aab4d4; stroke-width: 1; }
    .cV { fill: #1565C0; } .cT { fill: #00897B; } .cO { fill: #EF6C00; } .cP { fill: #8E24AA; } .cR { fill: #C62828; } .cG { fill: #2E7D32; }
  </style>
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#37474F"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="1840" fill="#ffffff"/>

  <!-- Header / BLUF -->
  <text x="40" y="50" class="title">014 · 感知机：垃圾邮件打分游戏</text>
  <text x="40" y="82" class="subtitle">一句话本质："打分数、过及格线"这条小学规则，写成数学就是 <tspan class="cO" font-weight="700">w·x + b &gt; 0</tspan>，</text>
  <text x="40" y="106" class="subtitle">它叫感知机（perceptron），是一切神经网络的祖先。（The AND Operator / Perceptrons）</text>
  <line x1="40" y1="124" x2="860" y2="124" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ① story -->
  <text x="40" y="162" class="sec">① 📬 故事：已知 10 封邮件的真相，发明一条自动规则</text>
  <text x="40" y="192" class="small">已知每封邮件是否垃圾（标签 Yes/No），并数了两个词的出现次数：Lottery（彩票）、Win（中奖）。</text>
  <text x="40" y="218" class="small">规则形式：给每个词打"罪恶分"，邮件总分超过<tspan class="cV" font-weight="700">及格线（threshold 阈值）</tspan>就判为垃圾。</text>
  <text x="40" y="244" class="small">课件答案：Lottery <tspan class="cO" font-weight="700">1 分</tspan>、Win <tspan class="cO" font-weight="700">1 分</tspan>、及格线 <tspan class="cO" font-weight="700">1.5 分</tspan>。验证：</text>
  <rect x="50" y="258" width="600" height="28" rx="6" class="chip"/>
  <text x="62" y="277" class="code">(Lottery=1, Win=1)：1+1 = 2 &gt; 1.5 → 垃圾 ✅　与真实标签一致</text>
  <rect x="50" y="294" width="600" height="28" rx="6" class="chip"/>
  <text x="62" y="313" class="code">(Lottery=0, Win=1)：1 &lt; 1.5 → 正常 ✅　十行数据全部判对</text>

  <!-- ② dot product -->
  <text x="40" y="366" class="sec">② 🔢 翻译一：打分就是点积，整张表就是矩阵 × 向量</text>
  <text x="40" y="396" class="small">总分 = 1×Lottery + 1×Win = (1,1)·(Lottery, Win)。课件里的竖条 <tspan class="cV" font-weight="700">Model（模型）</tspan>就是权重向量 w。</text>
  <rect x="50" y="412" width="420" height="28" rx="6" class="chip"/>
  <text x="62" y="431" class="code">一封邮件：总分 = w · x　<tspan fill="#7B1FA2"># 点积上岗</tspan></text>
  <rect x="50" y="448" width="560" height="28" rx="6" class="chip"/>
  <text x="62" y="467" class="code">十封一起：数据表(10×2) @ w → 10 个总分　<tspan fill="#7B1FA2"># 矩阵×向量</tspan></text>

  <!-- ③ line -->
  <text x="40" y="520" class="sec">③ 🌗 翻译二：及格线是一条直线，平面被切成两半</text>

  <!-- plot: origin (170,690), scale 60 -->
  <line x1="140" y1="690" x2="420" y2="690" class="axis"/>
  <line x1="170" y1="540" x2="170" y2="720" class="axis"/>
  <text x="428" y="695" class="tiny" fill="#1565C0">Lottery</text>
  <text x="178" y="535" class="tiny" fill="#1565C0">Win</text>
  <!-- line x+y=1.5: (0,1.5)->(170,600); (1.5,0)->(260,690); extended -->
  <line x1="146" y1="576" x2="284" y2="714" stroke="#1E88E5" stroke-width="2.5"/>
  <!-- yes points (orange) -->
  <circle cx="230" cy="630" r="7" fill="#FB8C00" stroke="#E65100" stroke-width="1.5"/>
  <circle cx="290" cy="630" r="7" fill="#FB8C00" stroke="#E65100" stroke-width="1.5"/>
  <circle cx="170" cy="570" r="7" fill="#FB8C00" stroke="#E65100" stroke-width="1.5"/>
  <circle cx="230" cy="570" r="7" fill="#FB8C00" stroke="#E65100" stroke-width="1.5"/>
  <circle cx="290" cy="570" r="7" fill="#FB8C00" stroke="#E65100" stroke-width="1.5"/>
  <circle cx="290" cy="690" r="7" fill="#FB8C00" stroke="#E65100" stroke-width="1.5"/>
  <!-- no points (teal) -->
  <circle cx="170" cy="690" r="7" fill="#00897B" stroke="#00564E" stroke-width="1.5"/>
  <circle cx="170" cy="630" r="7" fill="#00897B" stroke="#00564E" stroke-width="1.5"/>
  <circle cx="230" cy="690" r="7" fill="#00897B" stroke="#00564E" stroke-width="1.5"/>
  <text x="320" y="560" class="tiny" font-weight="700" fill="#EF6C00">垃圾区 &gt; 1.5</text>
  <text x="75" y="725" class="tiny" font-weight="700" fill="#00897B">正常区 &lt; 1.5</text>

  <text x="480" y="570" class="small">每封邮件 = 平面上一个点</text>
  <text x="480" y="594" class="small">（横轴 Lottery，纵轴 Win）。</text>
  <text x="480" y="624" class="small">"总分 = 1.5" 连成一条直线：</text>
  <text x="480" y="648" class="code" font-size="13">1·Lottery + 1·Win = 1.5</text>
  <text x="480" y="678" class="small">右上（&gt;1.5）🟠 垃圾区；</text>
  <text x="480" y="702" class="small">左下（&lt;1.5）🟢 正常区。</text>
  <text x="480" y="732" class="small" font-weight="700" fill="#1565C0">分类 = 用一条线把两种点分开，</text>
  <text x="480" y="756" class="small" font-weight="700" fill="#1565C0">这条线叫决策边界 decision boundary。</text>

  <!-- ④ bias -->
  <text x="40" y="810" class="sec">④ 🎚️ 翻译三：及格线搬家，变身成 b（bias 偏置）</text>
  <rect x="50" y="826" width="560" height="28" rx="6" class="chip"/>
  <text x="62" y="845" class="code">1·Win + 1·Lottery &gt; 1.5　　　<tspan fill="#7B1FA2"># threshold 及格线在右边</tspan></text>
  <rect x="50" y="862" width="640" height="28" rx="6" class="chip"/>
  <text x="62" y="881" class="code">1·Win + 1·Lottery − 1.5 &gt; 0　<tspan fill="#7B1FA2"># 移项！b = −1.5 搬进模型</tspan></text>
  <text x="40" y="912" class="small">操作：给每封邮件加一列恒为 1 的假特征 "Bias"，模型从 (1,1) 变成 <tspan class="cO" font-weight="700">(1, 1, −1.5)</tspan>，</text>
  <text x="40" y="936" class="small">判定统一为最干净的 "<tspan font-weight="700">&gt; 0 吗？</tspan>"。这就是 y = wx + b 里 b 的出生证明：<tspan class="cR" font-weight="700">b = −及格线</tspan>。</text>

  <!-- ⑤ AND + perceptron -->
  <text x="40" y="990" class="sec">⑤ 🤖 同一台机器还会做逻辑：AND 门 + 它的大名"感知机"</text>

  <!-- AND table -->
  <rect x="60" y="1010" width="44" height="30" fill="#4285F4"/><text x="82" y="1030" class="cell" text-anchor="middle" fill="#fff" font-weight="700">x</text>
  <rect x="104" y="1010" width="44" height="30" fill="#4285F4"/><text x="126" y="1030" class="cell" text-anchor="middle" fill="#fff" font-weight="700">y</text>
  <rect x="148" y="1010" width="56" height="30" fill="#4285F4"/><text x="176" y="1030" class="cell" text-anchor="middle" fill="#fff" font-weight="700">总分</text>
  <rect x="204" y="1010" width="64" height="30" fill="#4285F4"/><text x="236" y="1030" class="cell" text-anchor="middle" fill="#fff" font-weight="700">判定</text>
  <rect x="60" y="1040" width="44" height="30" fill="#E3F2FD"/><text x="82" y="1060" class="cell" text-anchor="middle">0</text>
  <rect x="104" y="1040" width="44" height="30" fill="#E3F2FD"/><text x="126" y="1060" class="cell" text-anchor="middle">0</text>
  <rect x="148" y="1040" width="56" height="30" fill="#E3F2FD"/><text x="176" y="1060" class="cell" text-anchor="middle">0</text>
  <rect x="204" y="1040" width="64" height="30" fill="#00695C"/><text x="236" y="1060" class="cell" text-anchor="middle" fill="#fff" font-weight="700">No</text>
  <rect x="60" y="1070" width="44" height="30" fill="#E3F2FD"/><text x="82" y="1090" class="cell" text-anchor="middle">1</text>
  <rect x="104" y="1070" width="44" height="30" fill="#E3F2FD"/><text x="126" y="1090" class="cell" text-anchor="middle">0</text>
  <rect x="148" y="1070" width="56" height="30" fill="#E3F2FD"/><text x="176" y="1090" class="cell" text-anchor="middle">1</text>
  <rect x="204" y="1070" width="64" height="30" fill="#00695C"/><text x="236" y="1090" class="cell" text-anchor="middle" fill="#fff" font-weight="700">No</text>
  <rect x="60" y="1100" width="44" height="30" fill="#E3F2FD"/><text x="82" y="1120" class="cell" text-anchor="middle">0</text>
  <rect x="104" y="1100" width="44" height="30" fill="#E3F2FD"/><text x="126" y="1120" class="cell" text-anchor="middle">1</text>
  <rect x="148" y="1100" width="56" height="30" fill="#E3F2FD"/><text x="176" y="1120" class="cell" text-anchor="middle">1</text>
  <rect x="204" y="1100" width="64" height="30" fill="#00695C"/><text x="236" y="1120" class="cell" text-anchor="middle" fill="#fff" font-weight="700">No</text>
  <rect x="60" y="1130" width="44" height="30" fill="#E3F2FD"/><text x="82" y="1150" class="cell" text-anchor="middle">1</text>
  <rect x="104" y="1130" width="44" height="30" fill="#E3F2FD"/><text x="126" y="1150" class="cell" text-anchor="middle">1</text>
  <rect x="148" y="1130" width="56" height="30" fill="#E3F2FD"/><text x="176" y="1150" class="cell" text-anchor="middle" font-weight="700" fill="#EF6C00">2</text>
  <rect x="204" y="1130" width="64" height="30" fill="#C77F26"/><text x="236" y="1150" class="cell" text-anchor="middle" fill="#fff" font-weight="700">Yes</text>

  <!-- neuron diagram -->
  <circle cx="370" cy="1050" r="22" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="370" y="1056" class="small" text-anchor="middle" font-weight="700" fill="#1565C0">x₁</text>
  <circle cx="370" cy="1120" r="22" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.8"/>
  <text x="370" y="1126" class="small" text-anchor="middle" font-weight="700" fill="#1565C0">x₂</text>
  <circle cx="455" cy="1175" r="18" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="455" y="1181" class="small" text-anchor="middle" font-weight="700" fill="#666">b</text>
  <line x1="394" y1="1056" x2="528" y2="1078" stroke="#37474F" stroke-width="1.6" marker-end="url(#aK)"/>
  <text x="448" y="1052" class="tiny" font-weight="700" fill="#00897B">w₁</text>
  <line x1="394" y1="1116" x2="528" y2="1094" stroke="#37474F" stroke-width="1.6" marker-end="url(#aK)"/>
  <text x="448" y="1124" class="tiny" font-weight="700" fill="#00897B">w₂</text>
  <line x1="468" y1="1162" x2="532" y2="1118" stroke="#37474F" stroke-width="1.6" marker-end="url(#aK)"/>
  <circle cx="590" cy="1088" r="52" fill="#ffffff" stroke="#546E7A" stroke-width="2"/>
  <text x="578" y="1086" class="tiny" text-anchor="middle" font-weight="700">z = w·x + b</text>
  <line x1="614" y1="1044" x2="614" y2="1132" stroke="#546E7A" stroke-width="1.5"/>
  <text x="627" y="1093" class="tiny" font-weight="700" fill="#8E24AA">⌐</text>
  <line x1="642" y1="1072" x2="700" y2="1056" stroke="#37474F" stroke-width="1.6" marker-end="url(#aK)"/>
  <text x="710" y="1060" class="small" font-weight="700" fill="#EF6C00">z &gt; 0 → 1（垃圾）</text>
  <line x1="642" y1="1104" x2="700" y2="1120" stroke="#37474F" stroke-width="1.6" marker-end="url(#aK)"/>
  <text x="710" y="1130" class="small" font-weight="700" fill="#00897B">z ≤ 0 → 0（正常）</text>

  <text x="40" y="1206" class="small">权重 (1,1) + 阈值 1.5 完美实现 AND：只有 (1,1) 总分 2 过线（左表）。这台"加权打分 + 开关"机器，</text>
  <text x="40" y="1230" class="small">大名叫<tspan class="cO" font-weight="700">感知机（perceptron，1958）</tspan>——史上第一个人工神经元（右图，开关叫阶梯函数 step function）。</text>

  <!-- 💡 insights -->
  <text x="40" y="1284" class="sec">💡 补充洞察（课程没明说）</text>
  <text x="40" y="1314" class="small">💡 本课的 w 和 b 是"拍脑袋"直接给的；真实机器学习里它们是<tspan class="cV" font-weight="700">从数据里学出来的</tspan>——</text>
  <text x="40" y="1338" class="small">　"训练"就是不断微调 w、b，直到决策线把两类点分对。下一门课（微积分）讲的就是怎么调。</text>
  <text x="40" y="1368" class="small">💡 单层感知机只会画直线 → 著名局限：<tspan class="cR" font-weight="700">XOR（异或）的点任何直线都分不开</tspan>，</text>
  <text x="40" y="1392" class="small">　这曾引发第一次 AI 寒冬；解药 = 多层 + 非线性激活——正是你上上节课学的神经网络。</text>

  <!-- ⚠️ pitfalls -->
  <text x="40" y="1444" class="sec">⚠️ 易错点</text>
  <text x="40" y="1474" class="small" fill="#C62828">· b = −threshold，差一个负号，移项时最容易写错。</text>
  <text x="40" y="1500" class="small" fill="#C62828">· 答案不唯一：(2, 2, 阈值 3) 同样有效——按比例缩放不改变那条分类线。</text>
  <text x="40" y="1526" class="small" fill="#C62828">· 恰好压线（总分 = 1.5）的点归哪边？需事先约定（本课用"严格大于"）。</text>

  <!-- 🔗 connection -->
  <text x="40" y="1572" class="sec">🔗 承上启下</text>
  <text x="40" y="1600" class="small">· 点积课的"符号地图"在此就业：正负半平面 = 垃圾区 / 正常区，决策边界 = 那条垂直线。</text>
  <text x="40" y="1624" class="small" font-weight="700" fill="#1565C0">· 感知机把阶梯开关换成平滑的 σ，就是神经元 σ(W·X+b)；堆叠 → 神经网络 → Transformer。</text>

  <line x1="40" y1="1642" x2="860" y2="1642" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="1660" class="tiny" fill="#888" font-size="12">速记：垃圾邮件 = 打分过线；打分 = w·x，过线 = +b&gt;0；决策线切平面两半；这台机器叫感知机，神经网络的始祖。</text>

  <!-- 🧪 quiz -->
  <text x="40" y="1688" class="sec" font-size="17">🧪 自测（先答后看最底部灰字）</text>
  <text x="40" y="1714" class="small">Q1 概念：bias 和 threshold（及格线）是什么关系？</text>
  <text x="40" y="1740" class="small">Q2 计算：邮件 (Lottery=2, Win=1)，用模型 (1, 1, −1.5) 判定结果是？</text>
  <text x="40" y="1766" class="small">Q3 为什么：单层感知机为什么实现不了 XOR（恰好一个输入为 1 才输出 Yes）？</text>
  <text x="40" y="1796" class="tiny" fill="#aaa" font-size="11">A1：b = −threshold，及格线移项搬进模型。　A2：2 + 1 − 1.5 = 1.5 &gt; 0 → 判垃圾。</text>
  <text x="40" y="1814" class="tiny" fill="#aaa" font-size="11">A3：XOR 的 Yes 点 (1,0),(0,1) 与 No 点 (0,0),(1,1) 交叉分布，任何一条直线都无法把两类分开。</text>
</svg>
