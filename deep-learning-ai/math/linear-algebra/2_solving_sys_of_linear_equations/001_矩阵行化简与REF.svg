  <rect x="205" y="1597" width="34" height="34" fill="none" stroke="#F57F17" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- values -->
  <text x="78" y="1476" class="cell" text-anchor="middle" font-weight="700">1</text><text x="114" y="1476" class="cell" text-anchor="middle">*</text><text x="150" y="1476" class="cell" text-anchor="middle">*</text><text x="186" y="1476" class="cell" text-anchor="middle">*</text><text x="222" y="1476" class="cell" text-anchor="middle">*</text>
  <text x="78" y="1512" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="114" y="1512" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="150" y="1512" class="cell" text-anchor="middle" font-weight="700">1</text><text x="186" y="1512" class="cell" text-anchor="middle">*</text><text x="222" y="1512" class="cell" text-anchor="middle">*</text>
  <text x="78" y="1548" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="114" y="1548" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="150" y="1548" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="186" y="1548" class="cell" text-anchor="middle" font-weight="700">1</text><text x="222" y="1548" class="cell" text-anchor="middle">*</text>
  <text x="78" y="1584" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="114" y="1584" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="150" y="1584" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="186" y="1584" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="222" y="1584" class="cell" text-anchor="middle" fill="#aaa">0</text>
  <text x="78" y="1620" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="114" y="1620" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="150" y="1620" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="186" y="1620" class="cell" text-anchor="middle" fill="#aaa">0</text><text x="222" y="1620" class="cell" text-anchor="middle" fill="#aaa">0</text>
  <!-- pivot circles -->
  <circle cx="78" cy="1470" r="15" fill="none" stroke="#1E88E5" stroke-width="2.5"/>
  <circle cx="150" cy="1506" r="15" fill="none" stroke="#1E88E5" stroke-width="2.5"/>
  <circle cx="186" cy="1542" r="15" fill="none" stroke="#1E88E5" stroke-width="2.5"/>
  <text x="150" y="1658" class="tiny" text-anchor="middle">蓝圈 = 主元（3 个）；橙虚线 = 对角线（只有 1 个 1）</text>

  <!-- right text -->
  <text x="290" y="1476" class="small" font-weight="700" fill="#C62828">数对角线：1, 0, 0, 0, 0 → 只数到 1 个 → "秩 = 1"，错！</text>
  <text x="290" y="1506" class="small" font-weight="700" fill="#2E7D32">数主元（蓝圈）：3 个 → 秩 = 3，对！（= 非零行 3 条）</text>
  <text x="290" y="1540" class="small">第 2 行的主元跳过了第 2 列、落在第 3 列：某列消元后"踩空"</text>
  <text x="290" y="1564" class="small">（钉不死对应的未知数），主元只好右移。被跳过的列对应的</text>
  <text x="290" y="1588" class="small">未知数可以随便取值，术语叫"自由变量 free variable"。</text>
  <text x="290" y="1622" class="small" font-weight="700">"数对角线"只在主元恰好全踩在对角线上时碰巧成立</text>
  <text x="290" y="1646" class="small" font-weight="700">（方阵满秩时必然如此）。通用规则永远是：数主元。</text>

  <line x1="40" y1="1690" x2="860" y2="1690" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="1716" class="tiny" fill="#888" font-size="12">速记：刷矩阵的行 = 化简方程组，同一件事两套衣服。楼梯完整（每行都有主元）= 非奇异；出现全零行 = 奇异。</text>
  <text x="40" y="1738" class="tiny" fill="#888" font-size="12">主元的个数 = 非零行的条数 = 有效信息条数 = 秩。主元允许跳列、滑到对角线右边 —— 所以数主元，别数对角线。</text>
</svg>
