<svg width="900" height="1310" viewBox="0 0 900 1310" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    .title { font-size: 29px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 16px; fill: #666; }
    .sec { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
    .body { font-size: 15px; fill: #333; }
    .small { font-size: 14px; fill: #444; }
    .tiny { font-size: 13px; fill: #555; }
    .eq { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 14px; fill: #333; }
    .big { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 19px; font-weight: 700; }
    .cU { fill: #00897B; } .cV { fill: #1565C0; } .cP { fill: #9E9D24; } .cN { fill: #616161; } .cO { fill: #EF6C00; } .cT { fill: #8E24AA; }
    .axis { stroke: #90CAF9; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00897B"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker>
    <marker id="aY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9E9D24"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#616161"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#EF6C00"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="1310" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="50" class="title">📐 点积的几何意义 —— 深挖版</text>
  <text x="40" y="82" class="subtitle">主线：点积 = 长度 × 长度 × 方向相似度。符号告诉你"在哪半边"，大小告诉你"有多像"。颜色：<tspan class="cU" font-weight="700">u</tspan> <tspan class="cV" font-weight="700">v</tspan> <tspan class="cO" font-weight="700">投影u′</tspan> <tspan class="cT" font-weight="700">夹角θ</tspan></text>
  <line x1="40" y1="100" x2="860" y2="100" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ① notation & length -->
  <text x="40" y="138" class="sec">① 📏 尖括号记号，与"自己点自己 = 长度²"</text>
  <text x="40" y="168" class="small">⟨<tspan class="cU" font-weight="700">u</tspan>,<tspan class="cV" font-weight="700">v</tspan>⟩ 只是点积的另一种写法，和 u·v 完全是同一个东西（论文里两种都常见）。</text>
  <text x="60" y="200" class="big">⟨<tspan class="cU">u</tspan>,<tspan class="cU">u</tspan>⟩ = |<tspan class="cU">u</tspan>|²　　← 自己点自己 = 自身长度的平方</text>
  <text x="40" y="230" class="small">|u| 读"u 的模长"，就是箭头的长度。例：u=(3,4)：⟨u,u⟩ = 3²+4² = 25 → |u| = √25 = 5。</text>
  <text x="40" y="256" class="small" font-weight="700" fill="#1565C0">📐 这正是勾股定理 —— 点积自带"量尺"功能：想知道任何向量多长，拿它点自己再开根号。</text>

  <!-- ② three cases -->
  <text x="40" y="308" class="sec">② 🎯 夹角决定一切：三种情形 + 万能公式</text>

  <!-- D1 parallel: u dir (136,-42) = 0.8 × v dir (170,-52.5), exactly parallel -->
  <line x1="60" y1="390" x2="196" y2="348" stroke="#00897B" stroke-width="2.5" marker-end="url(#aT)"/>
  <text x="110" y="358" class="small" font-weight="700" fill="#00897B">u</text>
  <line x1="60" y1="432" x2="230" y2="379.5" stroke="#1565C0" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="170" y="420" class="small" font-weight="700" fill="#1565C0">v</text>
  <text x="145" y="470" class="tiny" text-anchor="middle" font-weight="700">同向 θ=0°：⟨u,v⟩ = |u|·|v|（拉满）</text>

  <!-- D2 perpendicular: v dir (120,-38), u dir (-22.8,-72) = ⊥ exactly (dot = -2736+2736 = 0) -->
  <line x1="350" y1="425" x2="470" y2="387" stroke="#1565C0" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="455" y="412" class="small" font-weight="700" fill="#1565C0">v</text>
  <line x1="350" y1="425" x2="327" y2="353" stroke="#00897B" stroke-width="2.5" marker-end="url(#aT)"/>
  <text x="310" y="345" class="small" font-weight="700" fill="#00897B">u</text>
  <path d="M361.4 421.4 L357.8 409.9 L346.4 413.6" fill="none" stroke="#EF6C00" stroke-width="2"/>
  <text x="425" y="470" class="tiny" text-anchor="middle" font-weight="700">垂直 θ=90°：⟨u,v⟩ = 0</text>

  <!-- D3 projection: v dir (150,-50), u=(50,-100); u' tip = origin + 79.06·v̂ = (715,405); dashed (690,330)->(715,405) ⊥ v -->
  <line x1="640" y1="430" x2="790" y2="380" stroke="#1565C0" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="775" y="370" class="small" font-weight="700" fill="#1565C0">v</text>
  <line x1="640" y1="430" x2="690" y2="330" stroke="#00897B" stroke-width="2.5" marker-end="url(#aT)"/>
  <text x="650" y="340" class="small" font-weight="700" fill="#00897B">u</text>
  <line x1="640" y1="430" x2="715" y2="405" stroke="#EF6C00" stroke-width="3" marker-end="url(#aO)"/>
  <text x="684" y="430" class="small" font-weight="700" fill="#EF6C00">u′</text>
  <line x1="690" y1="330" x2="715" y2="405" stroke="#9E9D24" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M705.5 408.2 L702.3 398.7 L711.8 395.5" fill="none" stroke="#EF6C00" stroke-width="1.6"/>
  <path d="M666.6 421.1 A28 28 0 0 0 652.5 405" fill="none" stroke="#8E24AA" stroke-width="1.6"/>
  <text x="666" y="400" class="small" font-weight="700" fill="#8E24AA">θ</text>
  <text x="715" y="470" class="tiny" text-anchor="middle" font-weight="700">一般情况：u 在 v 上的"影子" = 投影 u′</text>

  <text x="60" y="516" class="big">⟨<tspan class="cU">u</tspan>,<tspan class="cV">v</tspan>⟩ = |<tspan class="cO">u′</tspan>|·|<tspan class="cV">v</tspan>| = |<tspan class="cU">u</tspan>|·|<tspan class="cV">v</tspan>|·cos(<tspan class="cT">θ</tspan>)</text>
  <text x="40" y="548" class="small"><tspan class="cT" font-weight="700">θ</tspan> = 两向量的夹角；<tspan class="cO" font-weight="700">u′</tspan>（正交投影）= 从 u 的箭头向 v 垂直放下一条线，落在 v 上的那段"影子"。</text>
  <text x="40" y="574" class="small" font-weight="700">cos(θ) 是"方向相似度"旋钮：同向 = 1 → 垂直 = 0 → 反向 = −1。所以：点积 = 长度 × 长度 × 方向相似度。</text>

  <!-- ③ orthogonal -->
  <text x="40" y="626" class="sec">③ 🧭 正交 orthogonal：点积为 0 ⇔ 互相垂直</text>
  <text x="60" y="656" class="eq">u = (−1, 3)，v = (6, 2)：⟨u,v⟩ = 6×(−1) + 2×3 = −6 + 6 = <tspan font-weight="700" fill="#EF6C00">0</tspan> ✅ 恰好成直角</text>
  <text x="40" y="684" class="small">"正交"就是"垂直"的正式说法 —— 高维空间画不出来，但点积 = 0 这个判据照样好使。两向量互不包含对方的信息。</text>

  <!-- ④ half plane -->
  <text x="40" y="736" class="sec">④ 🌗 一条垂线把平面切成两半：点积的"符号地图"</text>

  <!-- tinted halves -->
  <polygon points="210,775 290,1015 440,1015 440,775" fill="#FFF59D" opacity="0.45"/>
  <polygon points="210,775 290,1015 60,1015 60,775" fill="#CFD8DC" opacity="0.5"/>
  <line x1="60" y1="895" x2="440" y2="895" class="axis"/>
  <line x1="250" y1="775" x2="250" y2="1015" class="axis"/>
  <!-- perpendicular line: dir (80,240) ⊥ u dir (120,-40): 9600-9600=0 ✓ -->
  <line x1="210" y1="775" x2="290" y2="1015" stroke="#00897B" stroke-width="3"/>
  <!-- u -->
  <line x1="250" y1="895" x2="370" y2="855" stroke="#1565C0" stroke-width="3" marker-end="url(#aB)"/>
  <text x="378" y="850" class="small" font-weight="700" fill="#1565C0">u=(6,2)</text>
  <path d="M261.4 891.2 L257.6 879.8 L246.2 883.6" fill="none" stroke="#EF6C00" stroke-width="1.8"/>
  <!-- example vectors -->
  <line x1="250" y1="895" x2="290" y2="815" stroke="#9E9D24" stroke-width="2.5" marker-end="url(#aY)"/>
  <text x="296" y="810" class="tiny" font-weight="700" fill="#9E9D24">(2,4)</text>
  <line x1="250" y1="895" x2="230" y2="835" stroke="#00897B" stroke-width="2.5" marker-end="url(#aT)"/>
  <text x="196" y="828" class="tiny" font-weight="700" fill="#00897B">(-1,3)</text>
  <line x1="250" y1="895" x2="170" y2="875" stroke="#616161" stroke-width="2.5" marker-end="url(#aG)"/>
  <text x="118" y="868" class="tiny" font-weight="700" fill="#616161">(-4,1)</text>
  <text x="395" y="800" class="tiny" font-weight="700" fill="#9E9D24">＋ 半边</text>
  <text x="90" y="1000" class="tiny" font-weight="700" fill="#616161">− 半边</text>
  <text x="305" y="1008" class="tiny" fill="#00897B" font-weight="700">与 u 垂直的线（=0）</text>

  <!-- right examples -->
  <text x="490" y="800" class="small" font-weight="700" fill="#9E9D24">🟡 同侧（夹角 &lt; 90°）：⟨u,v⟩ &gt; 0</text>
  <text x="510" y="826" class="eq">(6,2)·(2,4) = 12 + 8 = <tspan font-weight="700" fill="#EF6C00">20</tspan> ➕</text>
  <text x="490" y="864" class="small" font-weight="700" fill="#00897B">🟢 线上（夹角 = 90°）：⟨u,v⟩ = 0</text>
  <text x="510" y="890" class="eq">(6,2)·(−1,3) = −6 + 6 = <tspan font-weight="700" fill="#EF6C00">0</tspan> ⊥</text>
  <text x="490" y="928" class="small" font-weight="700" fill="#616161">⚫ 异侧（夹角 &gt; 90°）：⟨u,v⟩ &lt; 0</text>
  <text x="510" y="954" class="eq">(6,2)·(−4,1) = −24 + 2 = <tspan font-weight="700" fill="#EF6C00">−22</tspan> ➖</text>
  <text x="490" y="996" class="small" font-weight="700">一句话：点积的【符号】告诉你 v 落在</text>
  <text x="490" y="1020" class="small" font-weight="700">u 的哪半边；【大小】= 长度 × 方向相似度。</text>

  <!-- ⑤ ML connection -->
  <text x="40" y="1090" class="sec">⑤ 🤖 机器学习为什么把点积当命根子（补充）</text>
  <text x="40" y="1120" class="small">🎯 <tspan font-weight="700" fill="#1565C0">Attention 的打分 Q·K</tspan>，量的就是"方向像不像"：夹角小、方向同 → 分数高。你最早学的那一步，数学根基就是本课。</text>
  <text x="40" y="1146" class="small">📐 <tspan font-weight="700">余弦相似度</tspan> = ⟨u,v⟩ ÷ (|u|·|v|) = cos(θ)：把长度除掉、只留方向相似度。语义搜索、推荐系统的核心度量。</text>
  <text x="40" y="1172" class="small">🚧 <tspan font-weight="700">分类器</tspan>：w·x 的正负号决定样本落在边界哪一侧 —— ④ 里那张"两半平面"，就是最原始的决策边界。</text>
  <text x="40" y="1198" class="small">🧲 <tspan font-weight="700">词向量</tspan>：king 和 queen 的向量夹角小、点积大；king 和 banana 夹角大 —— "语义相似"被翻译成了"方向相近"。</text>

  <line x1="40" y1="1228" x2="860" y2="1228" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="1254" class="tiny" fill="#888" font-size="12">📐 速记：⟨u,u⟩ = 长度²（勾股定理）；⟨u,v⟩ = |u||v|cos(θ) = 长度×长度×方向相似度；</text>
  <text x="40" y="1276" class="tiny" fill="#888" font-size="12">符号三分天下 —— ＞0 同侧锐角、＝0 正交垂直、＜0 异侧钝角。与 u 垂直的那条线，就是正负的分界线。</text>
</svg>
