<svg width="900" height="1500" viewBox="0 0 900 1500" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    .title { font-size: 29px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 16px; fill: #666; }
    .sec { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
    .small { font-size: 14px; fill: #444; }
    .tiny { font-size: 13px; fill: #555; }
    .code { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 14px; fill: #1B5E20; }
    .cell { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 13px; fill: #333; }
    .chip { fill: #E8F5E9; stroke: #A5D6A7; stroke-width: 1; }
    .cV { fill: #1565C0; } .cT { fill: #00897B; } .cO { fill: #EF6C00; } .cP { fill: #8E24AA; } .cR { fill: #C62828; }
  </style>

  <rect x="0" y="0" width="900" height="1500" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="50" class="title">017 · 综合作业：线性变换 × 神经网络</text>
  <text x="40" y="82" class="subtitle">一句话本质：用"列 = 基向量的像"造出三个变换矩阵，再用矩阵乘法搭一个</text>
  <text x="40" y="106" class="subtitle">会学习的迷你神经网络 —— 整门线性代数课在这份作业里合龙。</text>
  <line x1="40" y1="124" x2="860" y2="124" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ① three matrices -->
  <text x="40" y="162" class="sec">① 🧰 三个待实现的变换矩阵（作业答案 + 推导法）</text>

  <rect x="40" y="182" width="260" height="160" rx="12" fill="#F1F8E9" stroke="#AED581" stroke-width="1.5"/>
  <text x="58" y="210" class="small" font-weight="700" fill="#2E7D32">整体拉伸 a 倍</text>
  <text x="58" y="238" class="cell">e₁ → (a, 0)</text>
  <text x="58" y="262" class="cell">e₂ → (0, a)</text>
  <text x="58" y="296" class="code" font-weight="700">[[a, 0], [0, a]]</text>
  <text x="58" y="324" class="tiny">x、y 方向同时放大 a 倍</text>

  <rect x="320" y="182" width="260" height="160" rx="12" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="338" y="210" class="small" font-weight="700" fill="#F57F17">水平错切 m</text>
  <text x="338" y="238" class="cell">e₁ → (1, 0) 不动</text>
  <text x="338" y="262" class="cell">e₂ → (m, 1) 被推歪</text>
  <text x="338" y="296" class="code" font-weight="700">[[1, m], [0, 1]]</text>
  <text x="338" y="324" class="tiny">(x,y) → (x+my, y)，矩形→平行四边形</text>

  <rect x="600" y="182" width="260" height="160" rx="12" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="618" y="210" class="small" font-weight="700" fill="#1565C0">旋转 θ（逆时针）</text>
  <text x="618" y="238" class="cell">e₁ → (cosθ, sinθ)</text>
  <text x="618" y="262" class="cell">e₂ → (−sinθ, cosθ)</text>
  <text x="618" y="296" class="code" font-weight="700">[[cosθ, −sinθ],</text>
  <text x="618" y="318" class="code" font-weight="700"> [sinθ,  cosθ]]</text>

  <text x="40" y="376" class="small" font-weight="700" fill="#1565C0">三个矩阵全部用同一招推出：把 e₁、e₂ 喂进变换，落点竖着填进两列 —— 016 的万能三步。</text>

  <!-- ② composition -->
  <text x="40" y="428" class="sec">② 🔗 组合变换 = 矩阵相乘（从右往左作用）</text>
  <rect x="50" y="444" width="700" height="28" rx="6" class="chip"/>
  <text x="62" y="463" class="code">旋转∘拉伸 (v) = R @ (S @ v) = (R @ S) @ v　<tspan fill="#7B1FA2"># 靠近 v 的 S 先动手</tspan></text>
  <text x="40" y="498" class="small">想"先拉伸、后旋转"，就写 R@S —— 注意书写顺序和作用顺序相反，这是上个 Lab AB≠BA 的延续。</text>

  <!-- ③ point cloud -->
  <text x="40" y="550" class="sec">③ 🍃 图像就是点云：一次矩阵乘，32 万个点齐变形</text>
  <text x="40" y="580" class="small">作业的叶子图片是一个形状 (2, 329076) 的矩阵：每一列是平面上一个点的坐标。</text>
  <rect x="50" y="596" width="640" height="28" rx="6" class="chip"/>
  <text x="62" y="615" class="code">A @ img　<tspan fill="#7B1FA2"># 一次矩阵乘法，329076 个点同时完成变形</tspan></text>
  <text x="40" y="650" class="small">旋转 π（180°）叶子倒立、错切把叶子推歪 —— 这就是矩阵乘法的规模化威力（也是 GPU 的饭碗）。</text>

  <!-- ④ neural network -->
  <text x="40" y="702" class="sec">④ 🧠 第二部分：单感知机神经网络做线性回归</text>
  <rect x="50" y="718" width="620" height="28" rx="6" class="chip"/>
  <text x="62" y="737" class="code">模型：Z = W X + b；Ŷ = Z　<tspan fill="#7B1FA2"># 回归输出连续值，所以不过开关/σ</tspan></text>
  <rect x="50" y="754" width="620" height="28" rx="6" class="chip"/>
  <text x="62" y="773" class="code">形状：W(1×2) @ X(2×m) → (1×m)，b 被广播到每个样本</text>
  <text x="40" y="808" class="small"><tspan class="cV" font-weight="700">损失函数（cost function）</tspan>：L = 1/(2m)·Σ(ŷ−y)²，衡量预测和真实差多远，越小越好。</text>
  <rect x="50" y="824" width="780" height="28" rx="6" class="chip"/>
  <text x="62" y="843" class="code">训练四步：定结构 → 随机初始化 W,b → 循环[前向传播 → 算 cost → 反向传播+更新] → 预测</text>
  <text x="40" y="878" class="small"><tspan class="cT" font-weight="700">前向传播（forward propagation）</tspan>= 把 X 沿着网络"算过去"得到 Ŷ —— 本作业实现的部分；</text>
  <text x="40" y="902" class="small"><tspan class="cP" font-weight="700">反向传播（backward propagation）</tspan>= 算出 W、b 该往哪调 —— 需要微积分，下一门课的主角。</text>
  <text x="40" y="928" class="small">训练 5000 轮后 cost 一路下降，predict(X) = W@X + b 的预测值与真实 y 非常接近。</text>

  <!-- 💡 insights -->
  <text x="40" y="980" class="sec">💡 补充洞察（课程没明说）</text>
  <text x="40" y="1010" class="small">💡 作业两部分其实是同一件事：感知机 = 线性变换（W）+ 平移（b）= 仿射变换。</text>
  <text x="40" y="1034" class="small">　 神经网络"思考"的本质，就是不断对数据空间做变形，直到答案变得显而易见。</text>
  <text x="40" y="1064" class="small">💡 014 的感知机做分类（输出过阶梯开关）；本作业做回归（直接输出 Z）——</text>
  <text x="40" y="1088" class="small">　 同一台机器，接不同的"输出端"就能干不同的活。这个套路在深度学习里无处不在。</text>

  <!-- ⚠️ pitfalls -->
  <text x="40" y="1140" class="sec">⚠️ 易错点</text>
  <text x="40" y="1170" class="small" fill="#C62828">· 本作业 X 是 2×m：特征在行、样本在列 —— 和很多教材的 m×2 相反，shape 错是最常见 bug。</text>
  <text x="40" y="1196" class="small" fill="#C62828">· 旋转矩阵默认逆时针；要顺时针就代入 −θ（cos 不变号、sin 变号）。</text>
  <text x="40" y="1222" class="small" fill="#C62828">· R@S ≠ S@R：先拉伸后旋转 ≠ 先旋转后拉伸（本例恰好可交换，但一般不行，别赌）。</text>

  <!-- 🔗 connection -->
  <text x="40" y="1274" class="sec">🔗 承上启下</text>
  <text x="40" y="1304" class="small">· 013 变形机 → 015 变形机串联 → 016 求矩阵的万能三步 → 本作业全部用上，线代第一程合龙。</text>
  <text x="40" y="1330" class="small" font-weight="700" fill="#1565C0">· 前向传播就是 Transformer 每天的日常；反向传播在微积分课等你 —— 路线图的下一站。</text>

  <line x1="40" y1="1352" x2="860" y2="1352" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="1372" class="tiny" fill="#888" font-size="12">速记：拉伸 [[a,0],[0,a]]、错切 [[1,m],[0,1]]、旋转 [[cosθ,−sinθ],[sinθ,cosθ]]；组合从右往左；感知机 = Wx+b = 仿射；训练 = 前向算误差、反向调参数。</text>

  <!-- 🧪 quiz -->
  <text x="40" y="1402" class="sec" font-size="17">🧪 自测（先答后看最底部灰字）</text>
  <text x="40" y="1426" class="small">Q1 概念：水平错切 m=2 的矩阵是？</text>
  <text x="40" y="1450" class="small">Q2 计算：旋转 90°（θ=π/2）的矩阵是？它把 (1,0) 送到哪里？</text>
  <text x="40" y="1474" class="small">Q3 为什么：本作业的 Ŷ = Z 为什么不过激活函数？</text>
  <text x="40" y="1496" class="tiny" fill="#aaa" font-size="11">A1：[[1,2],[0,1]]。　A2：[[0,−1],[1,0]]，(1,0) → (0,1)。　A3：回归要输出任意连续值，阶梯/σ 会把输出压进 0/1 或 (0,1)，反而坏事。</text>
</svg>
