<svg width="900" height="1615" viewBox="0 0 900 1615" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    .title { font-size: 29px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 16px; fill: #666; }
    .sec { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
    .small { font-size: 14px; fill: #444; }
    .tiny { font-size: 13px; fill: #555; }
    .code { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 14px; fill: #1B5E20; }
    .big { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 20px; font-weight: 700; fill: #1B5E20; }
    .cell { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 12px; fill: #333; }
    .chip { fill: #E8F5E9; stroke: #A5D6A7; stroke-width: 1; }
    .axis { stroke: #90CAF9; stroke-width: 1.5; }
    .cV { fill: #1565C0; } .cT { fill: #00897B; } .cO { fill: #EF6C00; } .cP { fill: #8E24AA; } .cR { fill: #C62828; } .cG { fill: #2E7D32; }
  </style>
  <defs>
    <marker id="aGy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#999" stroke-width="1.6" stroke-linecap="round"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="1615" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="50" class="title">020 · 乘积的行列式 Determinant of a Product</text>
  <text x="40" y="82" class="subtitle">一句话本质：变形机串联，面积倍数连乘 —— <tspan class="cO" font-weight="700">det(AB) = det(A) · det(B)</tspan>。</text>
  <text x="40" y="106" class="subtitle">推论：只要有一个因子（factor）是奇异的，乘积必奇异（0 乘任何数都是 0）。</text>
  <line x1="40" y1="124" x2="860" y2="124" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ① the rule -->
  <text x="40" y="162" class="sec">① 📜 公式 The Rule：面积倍数相乘</text>
  <rect x="50" y="178" width="400" height="36" rx="6" class="chip"/>
  <text x="62" y="203" class="big">det(AB) = det(A) · det(B)</text>

  <!-- chain diagram -->
  <!-- panel 1: unit square -->
  <line x1="60" y1="350" x2="200" y2="350" class="axis"/>
  <line x1="130" y1="270" x2="130" y2="420" class="axis"/>
  <rect x="130" y="324" width="26" height="26" fill="#B2DFDB" stroke="#00897B" stroke-width="2"/>
  <text x="143" y="342" class="cell" text-anchor="middle" font-weight="700">1</text>

  <line x1="206" y1="340" x2="248" y2="340" stroke="#999" stroke-width="2" marker-end="url(#aGy)"/>
  <text x="227" y="300" class="cell" text-anchor="middle" font-weight="700">A=[3 1;1 2]</text>
  <text x="227" y="318" class="cell" text-anchor="middle" font-weight="700" fill="#EF6C00">Det = 5</text>

  <!-- panel 2: parallelogram, origin (350,350), scale 22 -->
  <line x1="270" y1="350" x2="470" y2="350" class="axis"/>
  <line x1="350" y1="262" x2="350" y2="420" class="axis"/>
  <polygon points="350,350 416,328 438,284 372,306" fill="#FFE0B2" stroke="#FB8C00" stroke-width="2"/>
  <text x="394" y="322" class="cell" text-anchor="middle" font-weight="700" fill="#B26A00">5</text>

  <line x1="478" y1="340" x2="520" y2="340" stroke="#999" stroke-width="2" marker-end="url(#aGy)"/>
  <text x="499" y="300" class="cell" text-anchor="middle" font-weight="700">B=[1 1;-2 1]</text>
  <text x="499" y="318" class="cell" text-anchor="middle" font-weight="700" fill="#EF6C00">Det = 3</text>

  <!-- panel 3: final quad, origin (700,350), scale 14, columns of B@A=(4,-5),(3,0) -->
  <line x1="545" y1="350" x2="860" y2="350" class="axis"/>
  <line x1="700" y1="262" x2="700" y2="440" class="axis"/>
  <polygon points="700,350 756,420 798,420 742,350" fill="#B2DFDB" stroke="#00897B" stroke-width="2"/>
  <text x="749" y="392" class="cell" text-anchor="middle" font-weight="700" fill="#00564E">15</text>
  <text x="790" y="455" class="tiny" text-anchor="middle" fill="#888">Area blows up by 15</text>

  <rect x="240" y="470" width="420" height="28" rx="6" class="chip"/>
  <text x="252" y="489" class="code">合体 combined：B @ A = [4 3; -5 0]，Det = 15</text>
  <text x="40" y="530" class="small">单位正方形（Area 1）→ 经 A 变平行四边形（Area 5）→ 再经 B 变四边形（Area <tspan class="cO" font-weight="700">15</tspan>）。</text>
  <text x="40" y="556" class="small">先放大 5 倍、再放大 3 倍 = 总共 15 倍 —— 公式的几何来历，一句话讲完。</text>

  <!-- ② algebraic check -->
  <text x="40" y="610" class="sec">② 🧮 代数验算 Algebraic Check（课件原例）</text>
  <rect x="50" y="626" width="560" height="28" rx="6" class="chip"/>
  <text x="62" y="645" class="code">[3 1; 1 2] @ [1 1; -2 1] = [1 4; -3 3]</text>
  <rect x="50" y="662" width="700" height="28" rx="6" class="chip"/>
  <text x="62" y="681" class="code">det：3·2−1·1 = <tspan class="cO" font-weight="700">5</tspan>　　1·1−1·(−2) = <tspan class="cO" font-weight="700">3</tspan>　　1·3−4·(−3) = <tspan class="cO" font-weight="700">15</tspan></text>
  <text x="40" y="716" class="small" font-weight="700" fill="#2E7D32">5 × 3 = 15 ✅ 公式成立。而且不论 A@B 还是 B@A，det 都是 15（见 💡）。</text>

  <!-- ③ singular factor -->
  <text x="40" y="768" class="sec">③ 🟠 当一个因子奇异 When One Factor is Singular</text>
  <rect x="50" y="784" width="560" height="28" rx="6" class="chip"/>
  <text x="62" y="803" class="code">[3 1; 1 2] @ [1 2; 1 2] = [4 8; 3 6]</text>
  <rect x="50" y="820" width="700" height="28" rx="6" class="chip"/>
  <text x="62" y="839" class="code">det：<tspan class="cO" font-weight="700">5</tspan> × <tspan class="cR" font-weight="700">0</tspan> = <tspan class="cR" font-weight="700">0</tspan>　<tspan fill="#7B1FA2"># 验算：4·6 − 8·3 = 24 − 24 = 0 ✓</tspan></text>
  <text x="40" y="874" class="small">几何（课件首图）：正方形 → 平行四边形（Area 5）→ 被奇异的 B 压成<tspan class="cR" font-weight="700">线段 segment（Area 0）</tspan>。</text>
  <text x="40" y="900" class="small" font-weight="700" fill="#C62828">串联里只要有一台机器把空间压扁，后面谁也救不回来 —— 这就是 0 × 任何数 = 0 的几何版。</text>

  <!-- ④ quiz from class -->
  <text x="40" y="952" class="sec">④ 📝 课内测验 Quiz 与官方解答 Solution</text>
  <text x="40" y="982" class="small">题：奇异 × 非奇异（任意顺序 in any order）的乘积是？　Singular / Non-singular / Could be either</text>
  <text x="40" y="1008" class="small" font-weight="700" fill="#1565C0">答：永远 Singular。理由（官方解答）：det(AB) = det(A) × det(B)，有一个因子为 0，乘积必为 0。</text>

  <!-- 💡 insights -->
  <text x="40" y="1060" class="sec">💡 补充洞察（课程没明说）</text>
  <text x="40" y="1090" class="small">💡 为什么是"乘"不是"加"：变形机串联时面积倍数天然连乘 —— ×5 再 ×3 就是 ×15，</text>
  <text x="40" y="1112" class="small">　 公式不需要死记，它就是 019 课"det = 面积倍数"的直接推论。</text>
  <text x="40" y="1142" class="small">💡 det(AB) = det(BA)：虽然 AB ≠ BA（矩阵乘法不可交换），但两边的 det 都等于</text>
  <text x="40" y="1164" class="small">　 det(A)·det(B) —— 数字相乘可交换。两个乘积矩阵长得不同，"体重"却一样。</text>

  <!-- ⚠️ pitfalls -->
  <text x="40" y="1216" class="sec">⚠️ 易错点</text>
  <text x="40" y="1246" class="small" fill="#C62828">· det(A+B) ≠ det(A) + det(B)：行列式只对乘法友好，对加法不友好，别想当然推广。</text>
  <text x="40" y="1272" class="small" fill="#C62828">· 非奇异 × 非奇异 = 永远非奇异（两个非零数相乘不可能得 0）。</text>
  <text x="40" y="1298" class="small" fill="#C62828">· 奇异因子在前在后结论一样（any order）—— 这正是课内 quiz 的考点。</text>

  <!-- 🔗 connection -->
  <text x="40" y="1350" class="sec">🔗 承上启下</text>
  <text x="40" y="1378" class="small">· 016 课"变换串联 = 矩阵相乘" + 019 课"det = 面积" ⇒ 本课公式水到渠成。</text>
  <text x="40" y="1402" class="small" font-weight="700" fill="#1565C0">· 预告：撤销变形 → 面积倍数取倒数 → det(A⁻¹) = 1/det(A) —— 逆矩阵 inverse 就在前方。</text>

  <line x1="40" y1="1420" x2="860" y2="1420" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="1438" class="tiny" fill="#888" font-size="12">速记：det(AB) = det(A)·det(B)，串联变形面积倍数连乘；一个因子奇异 → 乘积必奇异；对乘法友好、对加法不友好。</text>

  <!-- 🧪 quiz -->
  <text x="40" y="1468" class="sec" font-size="17">🧪 自测（先答后看最底部灰字）</text>
  <text x="40" y="1494" class="small">Q1 概念：det(AB) 的公式是什么？</text>
  <text x="40" y="1520" class="small">Q2 计算：det(A) = 2、det(B) = −3，那么 det(AB) = ?</text>
  <text x="40" y="1546" class="small">Q3 为什么：从几何上讲，奇异 × 非奇异为什么必然奇异？</text>
  <text x="40" y="1576" class="tiny" fill="#aaa" font-size="11">A1：det(AB) = det(A)·det(B)。　A2：2 × (−3) = −6（面积放大 6 倍，且翻面）。</text>
  <text x="40" y="1594" class="tiny" fill="#aaa" font-size="11">A3：奇异那台机器把空间压扁成线/点、面积归 0 —— 串联里其他机器无法把压扁的空间恢复。</text>
</svg>
