<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker></defs>
<rect width="1260" height="640" rx="12" fill="#0f172a"/>
<text x="630.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#fde047">PrivateState：谁声明 · 谁读 · 谁写 · 谁可见</text>
<rect x="30" y="90" width="300" height="60" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="180.0" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5f9">① 调用方</text>
<text x="180.0" y="140" text-anchor="middle" font-size="13" fill="#f1f5f9" opacity="0.92">graph.invoke({'foo': 1})</text>
<rect x="30" y="230" width="300" height="150" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="180.0" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#bbf7d0">foo : int  〔OverallState〕</text>
<text x="180.0" y="280" text-anchor="middle" font-size="13" fill="#bbf7d0" opacity="0.92">StateGraph(OverallState) 的主 schema</text>
<text x="180.0" y="301" text-anchor="middle" font-size="13" fill="#bbf7d0" opacity="0.92">→ 决定 invoke 的输入 / 输出</text>
<text x="180.0" y="322" text-anchor="middle" font-size="13" fill="#bbf7d0" opacity="0.92">→ 外部可见的 channel</text>
<rect x="30" y="470" width="300" height="70" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="180.0" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5f9">⑥ invoke 返回 {'foo': 3}</text>
<text x="180.0" y="520" text-anchor="middle" font-size="13" fill="#f1f5f9" opacity="0.92">只含 OverallState 的 key</text>
<rect x="430" y="100" width="400" height="100" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="630.0" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">node_1(state: OverallState) -&gt; PrivateState</text>
<text x="630.0" y="150" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">入参注解 OverallState → 读 key：foo</text>
<text x="630.0" y="171" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">返回注解 PrivateState（仅类型提示）→ 实际写 baz</text>
<rect x="430" y="390" width="400" height="100" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="630.0" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">node_2(state: PrivateState) -&gt; OverallState</text>
<text x="630.0" y="440" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">入参注解 PrivateState → 读 baz，并声明 baz channel</text>
<text x="630.0" y="461" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">返回注解 OverallState（仅类型提示）→ 写 foo</text>
<rect x="930" y="230" width="300" height="150" rx="10" fill="#2d1f1f" stroke="#f87171" stroke-width="2"/>
<text x="1080.0" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#fca5a5">baz : int  〔PrivateState〕</text>
<text x="1080.0" y="280" text-anchor="middle" font-size="13" fill="#fca5a5" opacity="0.92">不在 StateGraph(...) 的主 schema 里</text>
<text x="1080.0" y="301" text-anchor="middle" font-size="13" fill="#fca5a5" opacity="0.92">由 node_2 的入参注解声明成 channel</text>
<text x="1080.0" y="322" text-anchor="middle" font-size="13" fill="#fca5a5" opacity="0.92">→ 私有 channel，仅内部中转</text>
<text x="1080.0" y="343" text-anchor="middle" font-size="13" fill="#fca5a5" opacity="0.92">→ 最终输出里看不到</text>
<path d="M180,150 L180,228" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>
<rect x="186" y="181" width="84.4" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="190" y="196" text-anchor="start" font-size="13" font-weight="600" fill="#a5f3fc">写入 foo=1</text>
<path d="M330,262 Q380,200 428,170" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="341" y="273" width="143.6" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="345" y="288" text-anchor="start" font-size="13" font-weight="600" fill="#bbf7d0">② node_1 读 foo=1</text>
<path d="M830,150 Q1000,140 1060,228" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#ar)"/>
<rect x="896" y="113" width="91.79999999999998" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="900" y="128" text-anchor="start" font-size="13" font-weight="600" fill="#fca5a5">③ 写 baz=2</text>
<path d="M1060,382 Q1000,440 832,440" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#ar)"/>
<rect x="896" y="463" width="193.8" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="900" y="478" text-anchor="start" font-size="13" font-weight="600" fill="#fca5a5">④ node_2 只看到 {baz: 2}</text>
<path d="M428,440 Q370,410 332,350" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="341" y="320" width="143.6" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="345" y="335" text-anchor="start" font-size="13" font-weight="600" fill="#bbf7d0">⑤ node_2 写 foo=3</text>
<path d="M180,382 L180,468" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<rect x="186" y="415" width="157.6" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="190" y="430" text-anchor="start" font-size="13" font-weight="600" fill="#fde68a">按 OverallState 过滤</text>
<text x="30" y="585" text-anchor="start" font-size="13" fill="#94a3b8">执行流：START → node_1 → node_2 → END   ｜   绿 = 主 schema（公开）   红 = 私有 schema   灰 = 节点</text>
<text x="30" y="610" text-anchor="start" font-size="13" fill="#fbbf24">stream_mode="values" 能看到全部 channel（含 baz）；invoke() 只返回主 schema 的 key</text>
</svg>