<rect x="30" y="450" width="1340" height="120" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="700.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">一条主线</text>
<text x="700.0" y="500" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">State 是共享黑板 → Node 往黑板写增量 → Reducer 决定怎么合并 → Edge/Command/Send 决定谁下一个写</text>
<text x="700.0" y="521" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">→ checkpointer 把每一步黑板存成 checkpoint（thread 内记忆、可暂停可回退）→ Store 存跨 thread 的长期记忆</text>
<text x="700.0" y="542" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">→ 把 graph 交给 Server，就有了 Assistant / Thread / Run 的 API，任何客户端都能调</text>
<rect x="30" y="590" width="650" height="140" rx="10" fill="#2d1f1f" stroke="#f87171" stroke-width="2"/>
<text x="44" y="616" text-anchor="start" font-size="15" font-weight="700" fill="#fca5a5">最常踩的 5 个坑</text>
<text x="44" y="640" text-anchor="start" font-size="12" fill="#fca5a5" opacity="0.92">① 并行写同 key 没 reducer → InvalidUpdateError</text>
<text x="44" y="660" text-anchor="start" font-size="12" fill="#fca5a5" opacity="0.92">② 没挂 checkpointer 就想多轮记忆 / 断点 → 失忆 / 报错</text>
<text x="44" y="680" text-anchor="start" font-size="12" fill="#fca5a5" opacity="0.92">③ 视图层 trim 以为改了 state（checkpoint 还在变胖）</text>
<text x="44" y="700" text-anchor="start" font-size="12" fill="#fca5a5" opacity="0.92">④ interrupt() 续跑节点从头重跑，副作用翻倍</text>
<text x="44" y="720" text-anchor="start" font-size="12" fill="#fca5a5" opacity="0.92">⑤ 用 __main__ 里的 Pydantic 对象做 state → 反序列化警告</text>
<rect x="720" y="590" width="650" height="140" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="734" y="616" text-anchor="start" font-size="15" font-weight="700" fill="#bbf7d0">2026 新写法（课件里的旧名仍能跑）</text>
<text x="734" y="640" text-anchor="start" font-size="12" fill="#bbf7d0" opacity="0.92">InMemorySaver ← MemorySaver   ·   interrupt() ← NodeInterrupt / interrupt_before</text>
<text x="734" y="660" text-anchor="start" font-size="12" fill="#bbf7d0" opacity="0.92">create_agent ← create_react_agent   ·   context_schema ← config_schema</text>
<text x="734" y="680" text-anchor="start" font-size="12" fill="#bbf7d0" opacity="0.92">stream_mode="messages" 本地可用 ← astream_events</text>
<text x="734" y="700" text-anchor="start" font-size="12" fill="#bbf7d0" opacity="0.92">LangSmith Deployment / Studio ← LangGraph Platform / Studio</text>
<text x="734" y="720" text-anchor="start" font-size="12" fill="#bbf7d0" opacity="0.92">input_schema= / output_schema= ← input= / output=</text>
