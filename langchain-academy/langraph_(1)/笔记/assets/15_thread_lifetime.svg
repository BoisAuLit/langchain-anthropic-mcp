<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker></defs>
<rect width="1400" height="600" rx="12" fill="#0f172a"/>
<text x="700.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#fde047">thread_id 是「钥匙」，checkpointer 是「保险箱」，Store 是「公共仓库」</text>
<rect x="30" y="60" width="400" height="250" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="42" y="80" font-size="13" font-weight="700" fill="#94a3b8">一次 invoke（不需要 thread_id）</text>
<rect x="50" y="95" width="100" height="46" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="100.0" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">输入</text>
<rect x="170" y="95" width="100" height="46" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="220.0" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">step_1</text>
<rect x="290" y="95" width="120" height="46" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="350.0" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">step_2…</text>
<path d="M152,118 L166,118" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<path d="M272,118 L286,118" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<rect x="50" y="165" width="360" height="120" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="64" y="191" text-anchor="start" font-size="14" font-weight="700" fill="#e2e8f0">state = 一组 channel（内存里）</text>
<text x="64" y="215" text-anchor="start" font-size="12" fill="#e2e8f0" opacity="0.92">每个 super-step：节点返回增量 → reducer 合并</text>
<text x="64" y="235" text-anchor="start" font-size="12" fill="#e2e8f0" opacity="0.92">跨 super-step 的 state 复用是图运行时自带的</text>
<text x="64" y="255" text-anchor="start" font-size="12" fill="#e2e8f0" opacity="0.92">实测：无 checkpointer 也得到 ['a', 'b:a']</text>
<text x="64" y="275" text-anchor="start" font-size="12" fill="#e2e8f0" opacity="0.92">invoke 结束 → 没有 checkpointer 就全部丢弃</text>
<rect x="470" y="60" width="500" height="250" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="482" y="80" font-size="13" font-weight="700" fill="#94a3b8">checkpointer（保险箱）  key = thread_id</text>
<text x="490" y="125" text-anchor="start" font-size="13" fill="#fde047" font-weight="700">thread_id="1"</text>
<rect x="620" y="95" width="70" height="44" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="655.0" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">cp0</text>
<path d="M692,117 L703,117" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="705" y="95" width="70" height="44" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="740.0" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">cp1</text>
<path d="M777,117 L788,117" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="790" y="95" width="70" height="44" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="825.0" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">cp2</text>
<path d="M862,117 L873,117" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="875" y="95" width="70" height="44" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="910.0" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">cp3</text>
<text x="490" y="195" text-anchor="start" font-size="13" fill="#fde047" font-weight="700">thread_id="2"</text>
<rect x="620" y="165" width="70" height="44" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="655.0" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">cp0</text>
<path d="M692,187 L703,187" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="705" y="165" width="70" height="44" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="740.0" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">cp1</text>
<text x="490" y="255" text-anchor="start" font-size="12" fill="#bbf7d0">每个 super-step 结束写一个 checkpoint；同 thread_id 的下一次 invoke 从最新 cp 继续</text>
<text x="490" y="280" text-anchor="start" font-size="12" fill="#bbf7d0">cp = 所有 channel 的快照 + next + metadata；checkpoint_id 可回到任意一格</text>
<rect x="1010" y="60" width="360" height="250" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="1022" y="80" font-size="13" font-weight="700" fill="#94a3b8">Store（公共仓库）  key = namespace</text>
<rect x="1030" y="95" width="320" height="110" rx="10" fill="#2a2418" stroke="#fbbf24" stroke-width="2"/>
<text x="1190.0" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#fde68a">("users", user_id) / "profile"</text>
<text x="1190.0" y="145" text-anchor="middle" font-size="12" fill="#fde68a" opacity="0.92">value = {"name": "Lance", ...}</text>
<text x="1190.0" y="165" text-anchor="middle" font-size="12" fill="#fde68a" opacity="0.92">所有 thread、所有 graph 都能读写</text>
<text x="1190.0" y="185" text-anchor="middle" font-size="12" fill="#fde68a" opacity="0.92">实测：t1 写入 → t2 另一个 graph 读到</text>
<text x="1030" y="240" text-anchor="start" font-size="12" fill="#fde68a">隔离靠 namespace（通常含 user_id）</text>
<text x="1030" y="262" text-anchor="start" font-size="12" fill="#fde68a">user_id 来自 config / context，不是 thread_id</text>
<path d="M972,160 L1006,160" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#ao)"/>
<path d="M972,200 L1006,200" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#ao)"/>
<text x="30" y="350" text-anchor="start" font-size="15" fill="#fde047" font-weight="700">钥匙没有有效期，保险箱有：thread_id 能活多久 = checkpointer 背后的存储活多久（均已实测）</text>
<rect x="30" y="370" width="256" height="110" rx="10" fill="#2d1f1f" stroke="#f87171" stroke-width="2"/>
<text x="158.0" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#fca5a5">无 checkpointer</text>
<text x="158.0" y="420" text-anchor="middle" font-size="12" fill="#fca5a5" opacity="0.92">没有保险箱</text>
<text x="158.0" y="440" text-anchor="middle" font-size="12" fill="#fca5a5" opacity="0.92">get_state → No checkpointer set</text>
<text x="158.0" y="460" text-anchor="middle" font-size="12" fill="#fca5a5" opacity="0.92">一次性任务</text>
<rect x="302" y="370" width="256" height="110" rx="10" fill="#2d2418" stroke="#fb923c" stroke-width="2"/>
<text x="430.0" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#fed7aa">InMemorySaver</text>
<text x="430.0" y="420" text-anchor="middle" font-size="12" fill="#fed7aa" opacity="0.92">Python 进程内存</text>
<text x="430.0" y="440" text-anchor="middle" font-size="12" fill="#fed7aa" opacity="0.92">进程停 / 换实例 → 丢</text>
<text x="430.0" y="460" text-anchor="middle" font-size="12" fill="#fed7aa" opacity="0.92">教学、单测</text>
<rect x="574" y="370" width="256" height="110" rx="10" fill="#2a2418" stroke="#fbbf24" stroke-width="2"/>
<text x="702.0" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">SqliteSaver</text>
<text x="702.0" y="420" text-anchor="middle" font-size="12" fill="#fde68a" opacity="0.92">本地 .db 文件</text>
<text x="702.0" y="440" text-anchor="middle" font-size="12" fill="#fde68a" opacity="0.92">跨进程 ✅（proc1 写 proc2 读到）</text>
<text x="702.0" y="460" text-anchor="middle" font-size="12" fill="#fde68a" opacity="0.92">单机 / 桌面应用</text>
<rect x="846" y="370" width="256" height="110" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="974.0" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">PostgresSaver</text>
<text x="974.0" y="420" text-anchor="middle" font-size="12" fill="#bbf7d0" opacity="0.92">Postgres</text>
<text x="974.0" y="440" text-anchor="middle" font-size="12" fill="#bbf7d0" opacity="0.92">跨进程、跨机器 ✅</text>
<text x="974.0" y="460" text-anchor="middle" font-size="12" fill="#bbf7d0" opacity="0.92">自己部署的生产</text>
<rect x="1118" y="370" width="256" height="110" rx="10" fill="#0f2729" stroke="#22d3ee" stroke-width="2"/>
<text x="1246.0" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#a5f3fc">LangGraph Server</text>
<text x="1246.0" y="420" text-anchor="middle" font-size="12" fill="#a5f3fc" opacity="0.92">Server 自带 Postgres</text>
<text x="1246.0" y="440" text-anchor="middle" font-size="12" fill="#a5f3fc" opacity="0.92">kill 重启后仍可 resume ✅</text>
<text x="1246.0" y="460" text-anchor="middle" font-size="12" fill="#a5f3fc" opacity="0.92">生产推荐（dev 模式存 .langgraph_api/）</text>
<text x="30" y="515" text-anchor="start" font-size="13" fill="#e2e8f0">同一把钥匙开同一个箱子：两个进程 / 两个 compile 出来的 graph，只要共用同一个存储 + 同一个 thread_id，看到的就是同一条历史。</text>
<text x="30" y="540" text-anchor="start" font-size="13" fill="#e2e8f0">不同的 InMemorySaver 实例 = 不同的箱子，thread_id 相同也互不相干。</text>
<text x="30" y="565" text-anchor="start" font-size="13" fill="#e2e8f0">LLM 本身没有记忆：每次调用都是把 state 里的 messages 全部重发。checkpointer 只是替你保存这份 messages。</text>
</svg>