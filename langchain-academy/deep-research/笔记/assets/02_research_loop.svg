<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker></defs>
<rect width="1400" height="600" rx="12" fill="#0f172a"/>
<text x="700.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#fde047">Research agent：手搓 ReAct 循环 + 两层压缩 + 搜索预算</text>
<rect x="30" y="60" width="640" height="290" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="42" y="80" font-size="13" font-weight="700" fill="#94a3b8">① 4 个节点（2_a）</text>
<rect x="60" y="100" width="200" height="80" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="160.0" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">llm_call</text>
<text x="160.0" y="150" text-anchor="middle" font-size="11" fill="#f1f5f9" opacity="0.92">model.bind_tools([tavily_search,</text>
<text x="160.0" y="169" text-anchor="middle" font-size="11" fill="#f1f5f9" opacity="0.92">think_tool]).invoke(sys + msgs)</text>
<rect x="330" y="100" width="200" height="80" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="430.0" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">tool_node</text>
<text x="430.0" y="150" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">按 tool_calls 逐个 invoke</text>
<text x="430.0" y="169" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">拼 ToolMessage(name, id)</text>
<path d="M262,130 L326,130" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<rect x="247.30769230769232" y="103" width="85.38461538461539" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="294" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">有 tool_calls</text>
<path d="M430,182 C430,230 160,230 160,182" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="273.15384615384613" y="231" width="35.69230769230769" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="295" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">循环</text>
<rect x="60" y="250" width="200" height="80" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
<text x="160.0" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#ddd6fe">compress_research</text>
<text x="160.0" y="300" text-anchor="middle" font-size="11" fill="#ddd6fe" opacity="0.92">system + 全部 msgs + 人类提醒</text>
<text x="160.0" y="319" text-anchor="middle" font-size="11" fill="#ddd6fe" opacity="0.92">→ compressed_research + raw_notes</text>
<path d="M160,182 L160,246" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#ap)"/>
<rect x="171" y="200" width="85.38461538461539" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="175" y="215" text-anchor="start" font-size="10" font-weight="600" fill="#e2e8f0">无 tool_calls</text>
<rect x="330" y="250" width="200" height="80" rx="10" fill="#2a2418" stroke="#fbbf24" stroke-width="2"/>
<text x="430.0" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">END</text>
<text x="430.0" y="300" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">output_schema =</text>
<text x="430.0" y="319" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">ResearcherOutputState</text>
<path d="M262,290 L326,290" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<text x="560" y="120" text-anchor="start" font-size="12" fill="#fde047" font-weight="700">should_continue:</text>
<text x="560" y="142" text-anchor="start" font-size="12" fill="#e2e8f0">last.tool_calls ?</text>
<text x="560" y="162" text-anchor="start" font-size="12" fill="#e2e8f0">→ tool_node</text>
<text x="560" y="182" text-anchor="start" font-size="12" fill="#e2e8f0">: compress_research</text>
<rect x="700" y="60" width="670" height="290" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="712" y="80" font-size="13" font-weight="700" fill="#94a3b8">② 两层 context engineering</text>
<rect x="720" y="100" width="300" height="110" rx="10" fill="#0f2729" stroke="#22d3ee" stroke-width="2"/>
<text x="870.0" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#a5f3fc">第 1 层：搜索结果摘要</text>
<text x="870.0" y="150" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">tavily_search 内部：raw_content →</text>
<text x="870.0" y="169" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">gpt-4.1-mini with_structured_output(Summary)</text>
<text x="870.0" y="188" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">summary + key_excerpts，去重 by URL</text>
<rect x="1050" y="100" width="300" height="110" rx="10" fill="#0f2729" stroke="#22d3ee" stroke-width="2"/>
<text x="1200.0" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#a5f3fc">第 2 层：研究结果压缩</text>
<text x="1200.0" y="150" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">compress_research 节点：整条轨迹 →</text>
<text x="1200.0" y="169" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">compress_model（max_tokens 显式设大）</text>
<text x="1200.0" y="188" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">compressed_research 给上级；raw_notes 留底</text>
<rect x="720" y="230" width="630" height="100" rx="10" fill="#2a2418" stroke="#fbbf24" stroke-width="2"/>
<text x="1035.0" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#fde68a">压缩最危险：防任务漂移</text>
<text x="1035.0" y="280" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">system prompt 在长轨迹前面会被「忘掉」→ 末尾再追加 compress_research_human_message：</text>
<text x="1035.0" y="299" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">重申主题、要求保留所有相关信息、强调对最终报告的重要性</text>
<rect x="30" y="375" width="1340" height="200" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="42" y="395" font-size="13" font-weight="700" fill="#94a3b8">③ 防「搜索失控」：prompt 三件套 + think_tool</text>
<rect x="50" y="410" width="400" height="140" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="250.0" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">像有限时间的人类研究员</text>
<text x="250.0" y="460" text-anchor="middle" font-size="11" fill="#e2e8f0" opacity="0.92">仔细读问题 → 先宽后窄</text>
<text x="250.0" y="479" text-anchor="middle" font-size="11" fill="#e2e8f0" opacity="0.92">每次搜完暂停评估：够了吗？缺什么？</text>
<text x="250.0" y="498" text-anchor="middle" font-size="11" fill="#e2e8f0" opacity="0.92">能自信回答就停，别追求完美</text>
<rect x="480" y="410" width="400" height="140" rx="10" fill="#2d1f1f" stroke="#f87171" stroke-width="2"/>
<text x="680.0" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#fca5a5">硬预算</text>
<text x="680.0" y="460" text-anchor="middle" font-size="11" fill="#fca5a5" opacity="0.92">简单 query 2–3 次搜索</text>
<text x="680.0" y="479" text-anchor="middle" font-size="11" fill="#fca5a5" opacity="0.92">复杂 query 最多 5 次</text>
<text x="680.0" y="498" text-anchor="middle" font-size="11" fill="#fca5a5" opacity="0.92">绝对上限 5 次：找不到也停</text>
<rect x="910" y="410" width="440" height="140" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="1130.0" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">think_tool：把思考变成一次工具调用</text>
<text x="1130.0" y="460" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">每次搜完必调：关键信息 / 缺口 / 够不够 / 下一步</text>
<text x="1130.0" y="479" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">返回 "Reflection recorded: ..." 进 messages</text>
<text x="1130.0" y="498" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">= 强制的「暂停评估」，可评估、可在 trace 里看</text>
</svg>