<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker></defs>
<rect width="1400" height="600" rx="12" fill="#0f172a"/>
<text x="700.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#fde047">Supervisor：派单 + 并行 + context isolation，两个节点互相 Command 跳转</text>
<rect x="30" y="60" width="820" height="300" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="42" y="80" font-size="13" font-weight="700" fill="#94a3b8">① supervisor graph（4_a）：只有两个节点</text>
<rect x="50" y="100" width="350" height="100" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="225.0" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">supervisor</text>
<text x="225.0" y="150" text-anchor="middle" font-size="11" fill="#f1f5f9" opacity="0.92">lead_researcher_prompt(date, 3 并发, 6 轮)</text>
<text x="225.0" y="169" text-anchor="middle" font-size="11" fill="#f1f5f9" opacity="0.92">bind_tools([ConductResearch, ResearchComplete, think_tool])</text>
<text x="225.0" y="188" text-anchor="middle" font-size="11" fill="#f1f5f9" opacity="0.92">→ Command(goto="supervisor_tools", +1 iteration)</text>
<rect x="450" y="100" width="380" height="100" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="640.0" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">supervisor_tools</text>
<text x="640.0" y="150" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">think_tool → 同步 invoke</text>
<text x="640.0" y="169" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">ConductResearch×N → asyncio.gather(researcher.ainvoke)</text>
<text x="640.0" y="188" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">每个结果 → ToolMessage(compressed_research)</text>
<path d="M402,135 L446,135" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<path d="M640,202 C640,250 225,250 225,202" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="343.0846153846154" y="253" width="165.83076923076925" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="430" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">goto="supervisor"（继续）</text>
<text x="50" y="300" text-anchor="start" font-size="12" fill="#fca5a5">退出条件（任一）：research_iterations ≥ 6 · 没有 tool_calls · 调了 ResearchComplete</text>
<text x="50" y="323" text-anchor="start" font-size="12" fill="#e2e8f0">退出时 update: notes = 所有 ToolMessage 内容（get_notes_from_tool_calls）→ 给最终报告</text>
<rect x="880" y="60" width="490" height="300" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="892" y="80" font-size="13" font-weight="700" fill="#94a3b8">② 子 agent：隔离的 context</text>
<rect x="900" y="100" width="200" height="60" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
<text x="1000.0" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#ddd6fe">researcher_agent #1</text>
<text x="1000.0" y="150" text-anchor="middle" font-size="10" fill="#ddd6fe" opacity="0.92">researcher_messages = [topic]</text>
<path d="M1102,130 L1140,130" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#ap)"/>
<rect x="1150" y="100" width="200" height="60" rx="10" fill="#0f2729" stroke="#22d3ee" stroke-width="2"/>
<text x="1250.0" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#a5f3fc">只回传</text>
<text x="1250.0" y="150" text-anchor="middle" font-size="10" fill="#a5f3fc" opacity="0.92">compressed_research + raw_notes</text>
<rect x="900" y="180" width="200" height="60" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
<text x="1000.0" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#ddd6fe">researcher_agent #2</text>
<text x="1000.0" y="230" text-anchor="middle" font-size="10" fill="#ddd6fe" opacity="0.92">researcher_messages = [topic]</text>
<path d="M1102,210 L1140,210" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#ap)"/>
<rect x="1150" y="180" width="200" height="60" rx="10" fill="#0f2729" stroke="#22d3ee" stroke-width="2"/>
<text x="1250.0" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#a5f3fc">只回传</text>
<text x="1250.0" y="230" text-anchor="middle" font-size="10" fill="#a5f3fc" opacity="0.92">compressed_research + raw_notes</text>
<rect x="900" y="260" width="200" height="60" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
<text x="1000.0" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#ddd6fe">researcher_agent #3</text>
<text x="1000.0" y="310" text-anchor="middle" font-size="10" fill="#ddd6fe" opacity="0.92">researcher_messages = [topic]</text>
<path d="M1102,290 L1140,290" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#ap)"/>
<rect x="1150" y="260" width="200" height="60" rx="10" fill="#0f2729" stroke="#22d3ee" stroke-width="2"/>
<text x="1250.0" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#a5f3fc">只回传</text>
<text x="1250.0" y="310" text-anchor="middle" font-size="10" fill="#a5f3fc" opacity="0.92">compressed_research + raw_notes</text>
<text x="900" y="345" text-anchor="start" font-size="12" fill="#fbbf24">父子不共享 messages：子 agent 看不到 supervisor 的历史，父只拿压缩结果</text>
<rect x="30" y="385" width="1340" height="190" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="42" y="405" font-size="13" font-weight="700" fill="#94a3b8">③ 派单准则 + 评估</text>
<rect x="50" y="420" width="420" height="130" rx="10" fill="#2a2418" stroke="#fbbf24" stroke-width="2"/>
<text x="260.0" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#fde68a">prompt 里的硬规则</text>
<text x="260.0" y="470" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">偏好单 agent；明确可并行才拆</text>
<text x="260.0" y="489" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">对比 A/B/C → 每个对象 1 个子 agent</text>
<text x="260.0" y="508" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">列表 / 排名 → 1 个；ConductResearch ≤ 3 轮</text>
<text x="260.0" y="527" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">子主题要清晰、独立、不重叠</text>
<rect x="500" y="420" width="420" height="130" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="514" y="446" text-anchor="start" font-size="13" font-weight="700" fill="#e2e8f0">两个工具其实是「信号」</text>
<text x="514" y="470" text-anchor="start" font-size="11" fill="#e2e8f0" opacity="0.92">@tool class ConductResearch(BaseModel):</text>
<text x="514" y="489" text-anchor="start" font-size="11" fill="#e2e8f0" opacity="0.92">  research_topic: str（要求一整段描述）</text>
<text x="514" y="508" text-anchor="start" font-size="11" fill="#e2e8f0" opacity="0.92">@tool class ResearchComplete(BaseModel): pass</text>
<text x="514" y="527" text-anchor="start" font-size="11" fill="#e2e8f0" opacity="0.92">没有函数体，由 supervisor_tools 解释执行</text>
<rect x="950" y="420" width="400" height="130" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="1150.0" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">评估「该不该并行」</text>
<text x="1150.0" y="470" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">只跑 nodes["supervisor"]</text>
<text x="1150.0" y="489" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">对比类 → 期望 2 个 tool_calls</text>
<text x="1150.0" y="508" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">排名类 → 期望 1 个</text>
<text x="1150.0" y="527" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">score = len(tool_calls) == 期望数</text>
</svg>