<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker></defs>
<rect width="1400" height="620" rx="12" fill="#0f172a"/>
<text x="700.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#fde047">Deep Research 知识地图：4 阶段 × 原语 × 评估 × 2026 现状</text>
<rect x="30" y="60" width="1340" height="200" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="42" y="80" font-size="13" font-weight="700" fill="#94a3b8">① 4 阶段 pipeline（每阶段 = 一个笔记）</text>
<rect x="50" y="95" width="250" height="140" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="175.0" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">01 Scoping</text>
<text x="175.0" y="145" text-anchor="middle" font-size="11" fill="#f1f5f9" opacity="0.92">structured output 当 router</text>
<text x="175.0" y="164" text-anchor="middle" font-size="11" fill="#f1f5f9" opacity="0.92">Command(goto, update)</text>
<text x="175.0" y="183" text-anchor="middle" font-size="11" fill="#f1f5f9" opacity="0.92">AgentInputState 接口隔离</text>
<path d="M302,165 L316,165" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<rect x="318" y="95" width="250" height="140" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="443.0" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">02 Research</text>
<text x="443.0" y="145" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">手搓 ReAct 循环</text>
<text x="443.0" y="164" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">两层压缩 + 防漂移</text>
<text x="443.0" y="183" text-anchor="middle" font-size="11" fill="#bbf7d0" opacity="0.92">搜索预算 + think_tool</text>
<path d="M570,165 L584,165" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<rect x="586" y="95" width="250" height="140" rx="10" fill="#0f2729" stroke="#22d3ee" stroke-width="2"/>
<text x="711.0" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#a5f3fc">03 MCP</text>
<text x="711.0" y="145" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">get_tools → bind_tools → ainvoke</text>
<text x="711.0" y="164" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">每次调用新开 session</text>
<text x="711.0" y="183" text-anchor="middle" font-size="11" fill="#a5f3fc" opacity="0.92">stdio / http / sse</text>
<path d="M838,165 L852,165" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<rect x="854" y="95" width="250" height="140" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
<text x="979.0" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ddd6fe">04 Supervisor</text>
<text x="979.0" y="145" text-anchor="middle" font-size="11" fill="#ddd6fe" opacity="0.92">ConductResearch 假工具</text>
<text x="979.0" y="164" text-anchor="middle" font-size="11" fill="#ddd6fe" opacity="0.92">asyncio.gather 并行</text>
<text x="979.0" y="183" text-anchor="middle" font-size="11" fill="#ddd6fe" opacity="0.92">子 agent 只回传压缩结果</text>
<path d="M1106,165 L1120,165" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<rect x="1122" y="95" width="250" height="140" rx="10" fill="#2a2418" stroke="#fbbf24" stroke-width="2"/>
<text x="1247.0" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">05 Full + Eval</text>
<text x="1247.0" y="145" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">子图当节点、同名 key 共享</text>
<text x="1247.0" y="164" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">recursion_limit 顶层 key</text>
<text x="1247.0" y="183" text-anchor="middle" font-size="11" fill="#fde68a" opacity="0.92">每步只测一个决策</text>
<rect x="30" y="285" width="640" height="310" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="42" y="305" font-size="13" font-weight="700" fill="#94a3b8">② 反复出现的 LangGraph / LangChain 原语</text>
<text x="50" y="338" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">with_structured_output(Schema)</text>
<text x="400" y="338" text-anchor="start" font-size="12" fill="#94a3b8">判断 / 生成 / 评估全靠它</text>
<text x="50" y="367" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">Command(goto, update)</text>
<text x="400" y="367" text-anchor="start" font-size="12" fill="#94a3b8">路由 + 更新一步到位</text>
<text x="50" y="396" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">StateGraph(S, input_schema=, output_schema=)</text>
<text x="400" y="396" text-anchor="start" font-size="12" fill="#94a3b8">接口隔离</text>
<text x="50" y="425" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">@tool / @tool(parse_docstring) / @tool class</text>
<text x="400" y="425" text-anchor="start" font-size="12" fill="#94a3b8">工具 = schema + docstring</text>
<text x="50" y="454" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">InjectedToolArg</text>
<text x="400" y="454" text-anchor="start" font-size="12" fill="#94a3b8">参数藏起来由代码传</text>
<text x="50" y="483" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">bind_tools + 手写 tool_node</text>
<text x="400" y="483" text-anchor="start" font-size="12" fill="#94a3b8">ReAct 内核</text>
<text x="50" y="512" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">add_node("x", compiled_subgraph)</text>
<text x="400" y="512" text-anchor="start" font-size="12" fill="#94a3b8">子图当节点</text>
<text x="50" y="541" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">asyncio.gather / ainvoke</text>
<text x="400" y="541" text-anchor="start" font-size="12" fill="#94a3b8">并行派单</text>
<text x="50" y="570" text-anchor="start" font-size="12" fill="#a5f3fc" font-weight="700">nodes["name"].invoke</text>
<text x="400" y="570" text-anchor="start" font-size="12" fill="#94a3b8">单测一个节点</text>
<rect x="700" y="285" width="670" height="310" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="712" y="305" font-size="13" font-weight="700" fill="#94a3b8">③ 2026-10 现状</text>
