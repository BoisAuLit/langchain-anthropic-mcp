<rect x="720" y="352" width="170" height="28" rx="14.0" fill="#1a2e1f" stroke="#4ade80" stroke-width="1.5"/>
<text x="805.0" y="369.96" text-anchor="middle" font-size="11" font-weight="600" fill="#bbf7d0">官方实现</text>
<text x="905" y="371" text-anchor="start" font-size="11" fill="#e2e8f0">deepagents/examples/deep_research（task + subagents + TodoListMiddleware）</text>
<rect x="720" y="392" width="170" height="28" rx="14.0" fill="#2a2418" stroke="#fbbf24" stroke-width="1.5"/>
<text x="805.0" y="409.96" text-anchor="middle" font-size="11" font-weight="600" fill="#fde68a">deep-research-new</text>
<text x="905" y="411" text-anchor="start" font-size="11" fill="#e2e8f0">上游克隆，仅模型名 / trace 链接 / LICENSE 变动</text>
<rect x="720" y="432" width="170" height="28" rx="14.0" fill="#0f2729" stroke="#22d3ee" stroke-width="1.5"/>
<text x="805.0" y="449.96" text-anchor="middle" font-size="11" font-weight="600" fill="#a5f3fc">本仓库环境</text>
<text x="905" y="451" text-anchor="start" font-size="11" fill="#e2e8f0">langgraph 1.2.0 · langchain 1.3.1 · mcp-adapters 0.2.2，import 无警告</text>
<rect x="720" y="472" width="170" height="28" rx="14.0" fill="#2d1f1f" stroke="#f87171" stroke-width="1.5"/>
<text x="805.0" y="489.96" text-anchor="middle" font-size="11" font-weight="600" fill="#fca5a5">课程失实处</text>
<text x="905" y="491" text-anchor="start" font-size="11" fill="#e2e8f0">recursion_limit 写在 configurable 里无效；默认已是 10007</text>
