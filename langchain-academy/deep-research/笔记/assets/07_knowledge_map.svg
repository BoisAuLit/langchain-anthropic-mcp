<text x="805.0" y="529.96" text-anchor="middle" font-size="11" font-weight="600" fill="#fde68a">部署命名</text>
<text x="905" y="531" text-anchor="start" font-size="11" fill="#e2e8f0">LangGraph Platform → LangSmith Deployment；Studio 浏览器版</text>
<rect x="720" y="552" width="170" height="28" rx="14.0" fill="#1a2e1f" stroke="#4ade80" stroke-width="1.5"/>
<text x="805.0" y="569.96" text-anchor="middle" font-size="11" font-weight="600" fill="#bbf7d0">没变的原则</text>
<text x="905" y="571" text-anchor="start" font-size="11" fill="#e2e8f0">scoping 先行 · 预算 + think_tool · 能单线别派 · 压缩防漂移 · 每步可测</text>
