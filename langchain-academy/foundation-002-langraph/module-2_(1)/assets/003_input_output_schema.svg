<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 690" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker></defs>
<rect width="1400" height="690" rx="12" fill="#0f172a"/>
<text x="700.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#fde047">Input / Output Schema：声明 · 过滤 · 节点注解 · channels</text>
<text x="30" y="66" text-anchor="start" font-size="14" fill="#fbbf24">StateGraph(OverallState, input_schema=InputState, output_schema=OutputState)</text>
<rect x="20" y="90" width="250" height="100" rx="10" fill="#0f2729" stroke="#22d3ee" stroke-width="2"/>
<text x="145.0" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#a5f3fc">InputState</text>
<text x="145.0" y="140" text-anchor="middle" font-size="13" fill="#a5f3fc" opacity="0.92">question : str</text>
<text x="145.0" y="161" text-anchor="middle" font-size="13" fill="#a5f3fc" opacity="0.92">→ 对外的入口（输入约束）</text>
<rect x="555" y="90" width="290" height="100" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="700.0" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#bbf7d0">OverallState（主 schema）</text>
<text x="700.0" y="140" text-anchor="middle" font-size="13" fill="#bbf7d0" opacity="0.92">question · answer · notes</text>
<text x="700.0" y="161" text-anchor="middle" font-size="13" fill="#bbf7d0" opacity="0.92">→ 内部全部 channels</text>
<rect x="1130" y="90" width="250" height="100" rx="10" fill="#2a2418" stroke="#fbbf24" stroke-width="2"/>
<text x="1255.0" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">OutputState</text>
<text x="1255.0" y="140" text-anchor="middle" font-size="13" fill="#fde68a" opacity="0.92">answer : str</text>
<text x="1255.0" y="161" text-anchor="middle" font-size="13" fill="#fde68a" opacity="0.92">→ 对外的出口（输出过滤）</text>
<rect x="20" y="270" width="210" height="120" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="125.0" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">① 调用方</text>
<text x="125.0" y="320" text-anchor="middle" font-size="13" fill="#f1f5f9" opacity="0.92">invoke({'question':'hi'})</text>
<rect x="290" y="260" width="380" height="140" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="480.0" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">thinking_node(state: InputState)</text>
<text x="480.0" y="310" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">入参注解 InputState</text>
<text x="480.0" y="331" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">→ 只看到 {question}</text>
<text x="480.0" y="352" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">返回 {answer:'bye', notes:'…Lance'}</text>
<rect x="730" y="260" width="400" height="140" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="930.0" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">answer_node(state: OverallState) -&gt; OutputState</text>
<text x="930.0" y="310" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">入参注解 OverallState</text>
<text x="930.0" y="331" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">→ 看到 question / answer / notes</text>
<text x="930.0" y="352" text-anchor="middle" font-size="13" fill="#e2e8f0" opacity="0.92">返回 {answer:'bye Lance'}（注解仅为类型提示）</text>
<rect x="1180" y="270" width="200" height="120" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
<text x="1280.0" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">⑥ invoke 返回</text>
<text x="1280.0" y="320" text-anchor="middle" font-size="13" fill="#f1f5f9" opacity="0.92">{'answer': 'bye Lance'}</text>
<rect x="20" y="500" width="1360" height="90" rx="10" fill="#1a2e1f" stroke="#4ade80" stroke-width="2"/>
<text x="700.0" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">运行时 channels（= OverallState 的全部 key）</text>
<rect x="300" y="538" width="190" height="34" rx="8" fill="#1a2e1f" stroke="#4ade80" stroke-width="1.5"/>
<text x="395" y="560" text-anchor="middle" font-size="14" fill="#bbf7d0">question</text>
<rect x="520" y="538" width="190" height="34" rx="8" fill="#1a2e1f" stroke="#4ade80" stroke-width="1.5"/>
<text x="615" y="560" text-anchor="middle" font-size="14" fill="#bbf7d0">answer</text>
<rect x="740" y="538" width="190" height="34" rx="8" fill="#2d1f1f" stroke="#f87171" stroke-width="1.5"/>
<text x="835" y="560" text-anchor="middle" font-size="14" fill="#fca5a5">notes（不出图）</text>
<path d="M230,330 L288,330" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<path d="M670,330 L728,330" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<path d="M1130,330 L1178,330" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<path d="M145,192 L145,268" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
<rect x="151" y="221" width="100.80000000000001" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="155" y="236" text-anchor="start" font-size="13" font-weight="600" fill="#a5f3fc">input_schema</text>
<path d="M700,192 L700,498" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#an)"/>
<rect x="704" y="211" width="77.8" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="708" y="226" text-anchor="start" font-size="13" font-weight="600" fill="#bbf7d0">主 schema</text>
<path d="M1280,192 L1280,268" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ay)"/>
<rect x="1286" y="221" width="108.20000000000002" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="1290" y="236" text-anchor="start" font-size="13" font-weight="600" fill="#fde68a">output_schema</text>
<path d="M125,392 L125,498" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>
<rect x="131" y="435" width="106.6" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="135" y="450" text-anchor="start" font-size="13" font-weight="600" fill="#a5f3fc">写入 question</text>
<path d="M330,498 L330,402" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>
<rect x="334" y="435" width="128.0" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="338" y="450" text-anchor="start" font-size="13" font-weight="600" fill="#a5f3fc">② 只读 question</text>
<path d="M520,402 L520,498" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
<rect x="524" y="435" width="150.2" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="528" y="450" text-anchor="start" font-size="13" font-weight="600" fill="#e2e8f0">③ 写 answer、notes</text>
<path d="M780,498 L780,402" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#an)"/>
<rect x="784" y="435" width="141.2" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="788" y="450" text-anchor="start" font-size="13" font-weight="600" fill="#bbf7d0">④ 读全部 3 个 key</text>
<path d="M1030,402 L1030,498" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<rect x="1034" y="435" width="113.20000000000002" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="1038" y="450" text-anchor="start" font-size="13" font-weight="600" fill="#fde68a">⑤ 覆盖 answer</text>
<path d="M1280,498 L1280,392" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ay)"/>
<rect x="1286" y="435" width="105.79999999999998" height="22" rx="5" fill="#0f172a" opacity="0.92"/>
<text x="1290" y="450" text-anchor="start" font-size="13" font-weight="600" fill="#fde68a">只导出 answer</text>
<text x="30" y="630" text-anchor="start" font-size="13" fill="#94a3b8">执行流：START → thinking_node → answer_node → END</text>
<text x="30" y="656" text-anchor="start" font-size="13" fill="#fbbf24">stream_mode="values" 会看到全部 channel（含 notes）；invoke() 只返回 OutputState 的 key</text>
</svg>